# Opt-in multimodal route over an OpenAI-compatible aggregating gateway
# (tokenrouter). The shipped composition already mounts `llm-pi-ai` dormant and
# `attachment-local`; this overlay supplies the provider profile that wakes the
# route and points the default model at it.
#
# The gateway multiplexes one endpoint over many vendors, so pi-ai's
# URL-derived detection cannot recognize it and would address it as OpenAI
# itself. Every wire fact it would otherwise guess is declared below, and each
# model states its own modalities.

- id: llm-pi-ai
  config:
    providers:
      tokenrouter:
        displayName: TokenRouter
        api: openai-completions
        # Pinned in composition, which outranks the environment by design:
        # omitting it would silently fall back to the installed catalog's
        # DeepSeek endpoint, and this route's model ids only exist on the
        # gateway.
        baseURL: http://tokenrouter.omgwow.tech:8081/v1
        # Credential *reference*, resolved per request; no key here.
        apiKeyEnv: DSH_TOKENROUTER_API_KEY

        # pi-ai cannot recognize this URL, so it would otherwise send the
        # OpenAI shape: the system prompt as `developer`, the output cap as
        # `max_completion_tokens`. The gateway's upstreams are mostly
        # non-OpenAI and reject both.
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens

        # Route fallback for a model whose entry says nothing. Text only: an
        # undeclared model is assumed blind, so adding one cannot silently
        # route images at a gateway that drops them.
        defaultInput: [text]

        # One request's total base64 image payload. Every image in history is
        # re-encoded into every request, so past the bound the oldest are
        # replaced by placeholder text and the session keeps completing
        # requests instead of failing permanently. 12MiB sits under the
        # gateway's body cap with headroom for the prompt, history, tools, and
        # JSON.
        maxRequestImageBytes: 12582912

        # Verified against the live gateway with a four-quadrant PNG whose
        # colors cannot be guessed in order. `input: [text, image]` is a CLAIM
        # about the endpoint, never a check of it, and this gateway makes the
        # claim load-bearing: several of its models accept an image part,
        # return HTTP 200, and answer about an image they never received.
        # Declaring those `[text]` is what turns a confident wrong answer into
        # an up-front refusal, so this list is the verified set and not the
        # advertised one. Re-verify before adding a model; `deepseek-v3.2`,
        # `deepseek-v4-flash`, `glm-5`, `glm-5.1`, `glm-5.2`, and `hy3` are the
        # known silent droppers.
        #
        # The DeepSeek V4 Flash family is three distinct ids and only one of
        # them sees: re-probed 2026-08-27, `-vision-exp` answered the quadrant
        # order correctly on 3 of 3 attempts, while bare `deepseek-v4-flash`
        # and `-flash-preview` both reasoned that no image was provided. Do not
        # widen the sibling entries to `[text, image]` on the family name.
        models:
          - id: deepseek-v4-flash-vision-exp
            name: DeepSeek V4 Flash Vision (experimental)
            # The gateway discloses no capacities and enforces no context limit
            # of its own: 900k prompt tokens were accepted on 2026-08-27, so
            # this is pi-ai's own figure for the V4 Flash family rather than a
            # probed ceiling.
            contextWindow: 1000000
            maxTokens: 32768
            input: [text, image]
            # A reasoning model whose thinking is separately controllable:
            # `off` sends deepseek's explicit `thinking: {type: disabled}`,
            # verified to return empty `reasoning_content`, and each named
            # level was accepted with reasoning present.
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
          - id: claude-opus-5
            name: Claude Opus 5
            contextWindow: 200000
            maxTokens: 32768
            input: [text, image]
          - id: claude-sonnet-5
            name: Claude Sonnet 5
            contextWindow: 200000
            maxTokens: 32768
            input: [text, image]
          - id: gemini-3.1-pro-preview
            name: Gemini 3.1 Pro
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 400000
            maxTokens: 32768
            input: [text, image]
          - id: qwen3.5-plus
            name: Qwen3.5 Plus
            contextWindow: 262144
            maxTokens: 32768
            input: [text, image]
          - id: glm-5v-turbo
            name: GLM-5V Turbo
            contextWindow: 262144
            maxTokens: 32768
            input: [text, image]
          # Text-only on purpose: these endpoints accept an image part and
          # silently discard it. `[text]` makes the harness refuse the image
          # instead of letting the model answer about one it never saw. The V4
          # Flash siblings are listed rather than omitted because their ids
          # differ from the vision one by a suffix.
          - id: deepseek-v3.2
            name: DeepSeek V3.2 (text only)
            contextWindow: 128000
            maxTokens: 32768
            input: [text]
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash (text only)
            contextWindow: 1000000
            maxTokens: 32768
            input: [text]
          - id: deepseek-v4-flash-preview
            name: DeepSeek V4 Flash Preview (text only)
            contextWindow: 1000000
            maxTokens: 32768
            input: [text]

# Point new Agents at the gateway's vision route instead of the shipped
# DeepSeek default.
- id: agent-default-model
  config:
    provider: tokenrouter
    model: deepseek-v4-flash-vision-exp
