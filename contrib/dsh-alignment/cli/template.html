<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对齐页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%232f62d6' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2.5' y='2' width='11' height='12.5' rx='2'/%3E%3Cpath d='M5 5.5l1 1 2-2M5 10l1 1 2-2M9.5 6h2M9.5 10.5h2'/%3E%3C/svg%3E">
<style>
:root{
 color-scheme:light;
 --bg:#f4f5f7;--panel:#fff;--sunk:#f6f7f9;--hover:#eef0f3;--line:#e4e6ea;--line2:#eceef1;
 --ink:#15171b;--ink2:#444951;--ink3:#646a73;--ink4:#9aa0a9;--track:#e3e6eb;
 --blue:#2f62d6;--blue2:#2453bf;--bsoft:#edf2fd;--bline:#c5d4f5;
 --amber:#a35f00;--amber2:#d98a00;--asoft:#fff3df;--aline:#f1cf95;
 --red:#bf2c2c;--rsoft:#fdeeee;--rline:#f1c3c3;
 --green:#2a6e35;--gsoft:#e4f3e7;--gline:#b9dcc0;
 /* 按钮：四档高度 + 统一质感（顶部高光 + 轻投影；悬浮在正文上的再加一层落影） */
 --h-lg:40px;--h-md:34px;--h-sm:28px;--h-xs:24px;
 --face:linear-gradient(#fff,#f8f9fa);--lift:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(16,18,22,.07);--float:0 8px 20px -8px rgba(16,18,22,.3);
 --p1:#0e8a82;--p2:#7254d4;--p3:#cc4477;--p4:#3a8640;--p5:#5f6b7d;
 --font:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
 --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
 /* 引用原话（你说的「…」）：系统楷体，不打包；没有楷体的机器用正文字体 */
 --quote:KaiTi,"Kaiti SC",STKaiti,"BiauKai",var(--font);
 --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
::selection{background:#cddbfa}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:#cfd3da transparent}
.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 骨架：面包屑 / 详情区（固定在上）/ 会话区（滚动） */
.app{display:grid;grid-template-rows:auto auto 0 minmax(0,1fr);height:100vh}
.crumb{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px 0 18px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.bc{display:flex;align-items:center;gap:4px;min-width:0;flex:1;font-size:13px;color:var(--ink3)}
.bc>*{flex:none}
.bc .seg-t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc a{color:inherit;text-decoration:none;cursor:pointer;border-radius:5px;padding:2px 4px;display:inline-flex;align-items:center}
.bc a:hover{background:var(--hover);color:var(--ink)}
.bc .sp{color:var(--ink4);display:inline-flex}
.bc .sp .i{width:12px;height:12px}
.bc .cur{color:var(--ink);font-weight:650}
.bc .pdot{margin-right:6px}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.upd{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ghost{display:inline-flex;align-items:center;gap:5px;height:var(--h-sm);padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:12px;font-weight:650;cursor:pointer;transition:background .14s}
.ghost:hover{background:var(--hover)}
.ghost .i{transition:transform .28s var(--ease)}
.app.shut .ghost.shutb .i{transform:rotate(180deg)}
.ghost:disabled{cursor:default;color:var(--ink4);background:transparent}
.crumb{container-type:inline-size}
.bc a.seg-t{display:block}
.bc .seg-t:first-child{flex-shrink:4;min-width:3em}
.bc .seg-t.cur{flex-shrink:1;min-width:4.5em}
.fmtools{display:flex;align-items:center;gap:2px;padding-right:10px;margin-right:2px;border-right:1px solid var(--line)}
@container (max-width:600px){.fmtools .fmst .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@container (max-width:640px){.fmtools .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.fmtools .ghost{padding:0 7px}}
.fmst{display:inline-flex;align-items:center;gap:6px;max-width:300px;font-size:12px;color:var(--ink2);white-space:nowrap;margin-right:4px}
.fmst>span{overflow:hidden;text-overflow:ellipsis}
.fmst.err{color:var(--red)}
.fmst.ok{color:var(--ink2)}
.spin{width:14px;height:14px;flex:none;border-radius:50%;color:var(--blue);border:2px solid color-mix(in srgb,currentColor 22%,transparent);border-top-color:currentColor;animation:spin .9s linear infinite}
.fmpop{position:fixed;top:52px;right:14px;z-index:40;width:min(400px,calc(100vw - 28px));padding:14px 16px;border-radius:12px;background:var(--panel);box-shadow:0 14px 34px -12px rgba(16,18,22,.32),0 0 0 1px var(--line);font-size:13px;line-height:1.6;color:var(--ink2);animation:rise .18s var(--ease) both}
.fmpop h3{margin:0 0 6px;font-size:14px;font-weight:650;color:var(--ink)}
.fmpop ol{margin:0;padding-left:20px}
.fmpop .note{margin-top:8px;color:var(--ink3);font-size:12px}
.fmpop li+li{margin-top:2px}
.fmpop .mono{font-family:var(--mono);font-size:12px}
.fmpop .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.fmpop .go{height:var(--h-md);padding:0 14px;border:0;border-radius:9px;background:linear-gradient(#3b6ee0,var(--blue));color:#fff;font-size:13px;font-weight:650;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(16,18,22,.2)}
.fmpop .go:hover{background:linear-gradient(var(--blue),var(--blue2))}
.fmpop .acts .ghost{height:var(--h-md);padding:0 12px;font-size:13px}
.fmeff .v{font-weight:650;color:var(--ink)}
.fmeff:disabled .v{color:var(--ink4)}
.fmpop .effs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fmpop .eff{height:var(--h-sm);padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;transition:background .14s,border-color .14s}
.fmpop .eff:hover{background:var(--hover)}
.fmpop .eff[aria-pressed="true"]{border-color:var(--bline);background:var(--bsoft);color:var(--blue);font-weight:650;cursor:default}
.fmpop .eff:disabled:not([aria-pressed="true"]){color:var(--ink4);cursor:default;background:var(--panel)}
.fmpop .note.warn{color:var(--red)}
.fmeff .i.warn{color:var(--red)}
.fmpop pre{margin:8px 0 0;padding:8px 10px;max-height:160px;overflow:auto;border-radius:8px;background:var(--rsoft);color:#7d1d1d;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all}

.detail{display:grid;grid-template-columns:var(--lw,minmax(0,35fr)) 0 minmax(0,65fr);height:var(--dh,clamp(340px,56vh,620px));background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden;transition:height .3s var(--ease)}
.app.shut .detail{height:0;border-bottom-width:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#fbfbfc}
.lhead{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
.lscroll{flex:1;min-height:0;overflow:auto;padding:2px 12px 18px}
.right{--rp:26px;min-height:0;display:flex;flex-direction:column;position:relative}
/* 右栏：正文单独滚动；操作按钮悬浮在右栏底部（没有底条），正文底部留出按钮行的高度 */
.rbody{flex:1;min-height:0;overflow:auto;padding:20px var(--rp) calc(var(--fh,0px) + 28px);scroll-padding-bottom:calc(var(--fh,0px) + 12px)}
.rfoot{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 var(--rp) 14px;pointer-events:none}
.rfoot:empty{display:none}
/* 起名 right：.todos 这类内层容器里的元素也能按右栏宽度判断两栏（没名字的 @container 只看最近的那个容器） */
.right{container:right / inline-size}
/* 右栏 ≤ 400（窗口约 620 以下，含 575、420 宽）时按钮行占掉正文宽的一半到九成（实测「确认 / 修改 / 放弃」374 宽占 71%），悬浮会把整行正文挡住、还从按钮缝里漏字：
   改成贴底的实底条（顶上一条细线），正文滚到条下面就看不见；按钮去掉悬浮落影。右栏 ≤ 340（侧栏约 420 宽）时按钮再收窄，「确认 / 修改 / 放弃」保持一行 */
@container (max-width:400px){.rfoot{--float:0 0 0 transparent;padding-top:8px;padding-bottom:10px;background:var(--panel);box-shadow:0 -1px 0 var(--line2);pointer-events:auto}}
@container (max-width:340px){.rfoot .btn{padding:0 10px}.rfoot .acts{gap:6px}.rfoot .acts .rgt{gap:6px}}
.board{overflow:auto;padding:16px 16px 110px}
/* 分隔条：0 宽 / 0 高的网格轨道，可点范围 10px（触屏 16px），偏向右栏 / 会话区一侧，只盖住线本身，不压左栏、详情区和会话区的滚动条；看到的仍是原来 1px 的边框，悬停 / 拖动 / 聚焦时在同一位置换成蓝线 */
.split{position:relative;z-index:6;touch-action:none}
.split::before,.split::after{content:"";position:absolute}
.split::after{background:transparent;transition:background .12s .06s}
.hsplit{cursor:row-resize}
.hsplit::before{left:0;right:14px;top:-1px;bottom:-9px}
.hsplit::after{left:0;right:0;top:-1px;height:1px}
.vsplit{cursor:col-resize}
.vsplit::before{top:0;bottom:0;left:-1px;right:-9px}
.vsplit::after{top:0;bottom:0;left:-1px;width:1px}
.split:hover::after,.split.on::after,.split:focus-visible::after{background:var(--blue)}
.split:focus-visible{outline:none}
.split:focus-visible::after{box-shadow:0 0 0 1px var(--blue)}
@media (pointer:coarse){.hsplit::before{bottom:-15px}.vsplit::before{right:-15px}}
.app.shut .hsplit,.app.shut .vsplit{visibility:hidden}
.app.drag{user-select:none}
/* 拖动时详情区里的网页（iframe）不接鼠标，指针滑进去也继续算在分隔条上 */
.app.drag iframe{pointer-events:none}
.app.drag .detail{transition:none}
.app.drag-h *{cursor:row-resize!important}
.app.drag-w *{cursor:col-resize!important}

/* 分段切换（滑块） */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#eceef2;border-radius:11px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:transparent;height:var(--h-sm);padding:0 14px;border-radius:8px;font-size:12px;font-weight:650;color:var(--ink3);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .th{position:absolute;z-index:0;top:3px;bottom:3px;left:var(--x,3px);width:var(--w,0);background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(16,18,22,.1),0 2px 8px rgba(16,18,22,.05);transition:left .26s var(--ease),width .26s var(--ease)}
.seg.sm{padding:2px;border-radius:9px}
.seg.sm .th{top:2px;bottom:2px;border-radius:7px}
.seg.sm button{height:var(--h-xs);padding:0 10px;font-size:12px}
.lhead .seg{width:100%}
.cnt-b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fc{height:var(--h-sm);padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .14s,color .14s,border-color .14s}
.fc b{font-weight:650;font-variant-numeric:tabular-nums}
.fc.on{background:var(--bsoft);border-color:var(--bline);color:var(--blue2)}
.fc.on b{color:var(--blue)}

/* 左栏：决定（项目大卡 → 会话小组 → 决定行） */
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc,var(--p5));flex:none}
.dg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:10px}
.dg>h3,.pcard>h3{display:flex;align-items:center;gap:7px;margin:3px 6px 6px;font-size:12px;font-weight:650;color:var(--ink2);line-height:1.4}
.dg>h3 .c,.pcard>h3 .c{margin-left:auto;color:var(--ink3);font-weight:650;font-variant-numeric:tabular-nums}
.ds{background:var(--sunk);border-radius:9px;padding:3px 3px 4px;margin-top:5px}
.ds-h{display:flex;align-items:center;padding:5px 7px 3px;min-width:0;cursor:pointer}
.ds-l{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;margin:-1px -3px;padding:1px 3px;border:0;border-radius:5px;background:transparent;font-size:12px;font-weight:650;line-height:1.35;color:var(--ink3);cursor:pointer;transition:color .14s,background .14s}
.ds-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-l .i{width:12px;height:12px}
.ds-l:hover{color:var(--blue);background:var(--bsoft)}
.ds-l:hover span{text-decoration:underline;text-underline-offset:2px}
.ds-l.nolink{cursor:inherit}
.ds-l.nolink:hover{color:var(--ink3);background:transparent}
.ds-l.nolink:hover span{text-decoration:none}
.dr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:start;gap:8px;width:100%;border:0;background:transparent;border-radius:7px;padding:7px 7px;text-align:left;font-size:13px;line-height:1.4;cursor:pointer;color:var(--ink);transition:background .14s,box-shadow .14s}
.dr:hover,.crw:has(>.cref:hover)>.dr:not(.sel){background:#fff}
.dr.sel{background:transparent}
.ds{border:1px solid transparent;transition:background .14s,border-color .14s,box-shadow .2s}
/* 选中框落在决定所在的会话小卡（外面那个大框）上，和会话区 .sc.sel 同一种样式；同组有多条决定时，被选中的那条再加浅蓝底 */
.ds.sel{background:#fff;border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 6px 18px -8px rgba(47,98,214,.45)}
.ds.sel.multi .dr.sel{background:var(--bsoft)}
.tl .subs .dr.sel{background:var(--bsoft)}
.dr .t{font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dr .s{display:block;font-size:12px;color:var(--ink3);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .s b{color:var(--ink2);font-weight:650}
.dr .rk{margin-top:3px}
.dr .r{display:flex;align-items:center;gap:6px;padding-top:1px}
/* 条目引用：详情区条目前面的图标悬停换成复制（22px，盖在图标上；工具调用没有图标，悬停整行时出现在左边竖线上）；点了复制这一条的引用，图标换成勾、浮层写「已复制」 */
.crw{position:relative}
.cref{position:absolute;z-index:2;left:0;top:0;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:6px;background:var(--hover);color:var(--ink2);cursor:pointer;opacity:0;transition:opacity .12s,background .12s,color .12s}
.cref .i{width:13px;height:13px}
.cref:hover,.cref:focus-visible,.cref.ok,.cref.bad{opacity:1}
.cref:hover{background:#e3e6ec;color:var(--ink)}
.cref.ok{color:var(--blue)}
.cref.bad{color:var(--red)}
@media (hover:none){.cref{display:none}}
.crw>.cref{left:2px;top:5px}
.tl .subs .crw>.cref{top:3px}
.tl>li>.cref{left:-5px;top:6px}
.chain li{position:relative}
.chain li>.cref{left:3px;top:3px}
.todos li{position:relative}
.todos li>.cref{left:2px;top:3px}
.an .occ>li{position:relative}
.an .occ>li>.cref{left:-24px;top:4px}
/* 按钮骑在竖线正中；时间往右让 4px，按钮和时间之间留 6px */
.an .occ>li>.oh{padding-left:4px}
.an .occ>li:hover>.cref{opacity:1}
.aw{display:inline-flex}
.aw>.cref{left:7px;top:3px}
.rk{width:12px;height:12px;display:block}
.rk.hi{fill:var(--ink)}.rk.mid{fill:none;stroke:var(--ink3);stroke-width:1.6}.rk.lo{fill:var(--ink4)}
.rk.st{fill:none;stroke:var(--ink3);stroke-width:1.6}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.due .i{width:12px;height:12px}
.due.warn{color:var(--amber)}
.due.over{color:#fff;background:var(--amber);border-radius:5px;padding:1px 6px}
.pk{color:var(--blue);display:inline-flex}
.pk .i{width:13px;height:13px;stroke-width:2.2}
.newdot{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block;flex:none}
.lempty{display:grid;place-items:center;gap:6px;padding:36px 0;color:var(--ink3);font-size:13px}
.lempty .i{width:22px;height:22px;color:var(--ink4)}

/* 左栏：会话（轮次时间线） */
.sh{padding:4px 2px 12px}
.sh h2{margin:0 0 7px;font-size:15px;font-weight:650;line-height:1.4}
.sh .row{display:flex;flex-wrap:wrap;gap:6px}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl>li{position:relative;padding:0 0 10px 20px}
.tl>li::before{content:"";position:absolute;left:6px;top:20px;bottom:-4px;width:1.5px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl .nd{position:absolute;left:0;top:10px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--ink4)}
.tl .nd.run{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 3px var(--bsoft);animation:pulse 2s ease-in-out infinite}
.tl .nd.blk{border-color:var(--amber2);background:var(--amber2)}
.tl .nd.stop{border-color:var(--ink);background:var(--ink);border-radius:3px}
.tl .nd.err{border-color:var(--red);background:var(--red)}
.tl .nd.wait{border-color:var(--ink2)}
.tl .nd.fin{border-color:var(--ink4);background:var(--ink4)}
.rr{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer;transition:background .14s,box-shadow .14s}
.rr:hover{background:var(--hover)}
.rr.sel{position:relative;z-index:1;background:#fff;box-shadow:0 0 0 1.5px var(--blue),0 6px 18px -8px rgba(47,98,214,.45)}
.rr .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:500}
.rr .k .i{width:12px;height:12px}
.rr .k .tm{margin-left:auto;font-variant-numeric:tabular-nums}
.rr .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:650;line-height:1.4;margin-top:2px}
.tl .subs{margin:2px 0 0 10px;padding-left:8px;border-left:1.5px dashed var(--line)}
.tl .subs .dr{padding:5px 7px;font-size:12px}
.more{display:flex;align-items:center;gap:6px;height:var(--h-sm);border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:650;padding:0 8px;margin:0 0 8px 14px;border-radius:8px;cursor:pointer}
.more:hover{background:var(--bsoft)}
/* 左栏：会话链（接续关系上的所有会话，最早的在上） */
.chain{container-type:inline-size;margin:12px -2px 10px}
.chain-h{margin:0 2px 6px;font-size:12px;font-weight:650;color:var(--ink3)}
.chain ol{list-style:none;margin:0;padding:3px;border-radius:10px;background:var(--sunk);display:grid;gap:1px}
.cr{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:28px;padding:4px 8px 4px 5px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:12px;line-height:1.35;color:var(--ink2);cursor:pointer;transition:background .14s,color .14s}
.cr:hover,.chain li:has(>.cref:hover)>.cr:not(.cur){background:var(--hover);color:var(--ink)}
.cr .cn{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.cr .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .cw{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.cr.cur{background:#fff;color:var(--ink);cursor:default;box-shadow:0 1px 2px rgba(16,18,22,.06),0 0 0 1px var(--line)}
.cr.cur .cn{background:var(--ink);color:#fff;box-shadow:none}
.cr.cur .ct{font-weight:650}
.cgap{display:flex;align-items:center;gap:6px;width:100%;min-height:var(--h-sm);padding:0 8px 0 10px;border:0;border-radius:7px;background:transparent;color:var(--blue);font-size:12px;font-weight:650;cursor:pointer}
.cgap:hover{background:var(--bsoft)}
.cgap .i{width:12px;height:12px}
@container (max-width:250px){.cr .cw{display:none}.cr{align-items:start}.cr .ct{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}

/* 右栏：详情 */
.dh h1{margin:0 0 10px;font-size:19px;font-weight:650;line-height:1.38;letter-spacing:-.01em;text-wrap:balance;max-width:44em}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 18px}
/* 详情里正在执行的子 agent / 后台任务：在数字卡下面、事实行上面（两栏时在左栏，不占标题区，左右两栏顶端对齐）；折叠块同工具异常那一套：整行可点，右侧箭头 */
/* 行内容和数字卡左缘对齐，悬停底色向左出血 8px；上下离数字卡、事实行的线各约 14px */
.dw{display:flex;flex-direction:column;gap:4px;margin:-6px 0 10px -8px;max-width:488px}
.dw ul{list-style:none;margin:0;padding:0}
/* 名字在详情里写全（窄栏换行），图标和「已运行」对齐第一行 */
/* 图标和下面事实行的图标同一中线、名字和「现状」同一左缘（事实行：24px 图标块 + 10px 间距） */
.dw li,.dw summary{display:flex;align-items:flex-start;gap:15px;min-height:28px;padding:4px 8px 4px 13px;border-radius:7px;font-size:13px;line-height:1.5;color:var(--ink2)}
/* 后台任务：终端图标悬停换成「复制命令」按钮（同复制引用，盖在图标上） */
.dw li{position:relative}
.dw li>.cref{left:9px;top:3px}
.dw details li>.cref{left:17px}
.dw .i{width:14px;height:14px;margin-top:3px;color:var(--ink3)}
.dw.run :is(li,summary)>.i:not(.cv){color:var(--blue)}
/* 名字最多两行，超出省略（悬停看全名），这一行不把事实行推出首屏 */
.dw .wt{min-width:0;flex:0 1 auto;overflow-wrap:anywhere;line-break:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dw .wr{margin:1px 0 0 auto;padding-left:12px;flex:none;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.dw summary{cursor:pointer;list-style:none;user-select:none;color:var(--ink);font-weight:650}
.dw summary::-webkit-details-marker{display:none}
.dw summary:hover{background:var(--hover)}
.dw summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.dw summary .cv{margin:4px 0 0 auto;width:12px;height:12px;transition:transform .2s var(--ease)}
.dw details[open]>summary .cv{transform:rotate(180deg)}
/* 展开的逐行：细线挂在摘要图标中线下（20px），每行图标起点 = 摘要文字起点（42px） */
.dw details ul{margin:4px 0 4px 20px;border-left:1px solid var(--line)}
.dw details li{padding-left:21px;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:var(--h-xs);padding:0 9px;border-radius:7px;background:#f0f2f5;color:var(--ink2);font-size:12px;font-weight:650;border:0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .i{width:12px;height:12px;flex:none}
.chip>.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.lnk{background:transparent;box-shadow:inset 0 0 0 1px var(--bline);color:var(--blue);cursor:pointer;transition:background .14s;text-decoration:none}
.chip.lnk:hover{box-shadow:inset 0 0 0 1px var(--blue)}
.chip.warn{background:var(--asoft);color:var(--amber)}
.chip.over{background:var(--amber);color:#fff}
.chip.blue{background:var(--bsoft);color:var(--blue)}
.chip.ink{background:var(--ink);color:#fff}
.chip.red{background:var(--rsoft);color:var(--red)}
.chip.hand{background:transparent;box-shadow:inset 0 0 0 1px var(--ink4);color:var(--ink2)}
.chip.cp{cursor:pointer;font-family:var(--mono);font-weight:500}
.chip.cp:hover{background:#e6e9ed;color:var(--ink)}
.chip .dotp{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 2s ease-in-out infinite}

/* 正文块公共：行内记号 */
.n{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.cmp{display:inline-flex;align-items:center;gap:3px;padding:0 6px;margin:0 1px;border-radius:6px;background:#eceff4;white-space:nowrap;line-height:1.55}
.cmp .o{color:var(--ink3);font-variant-numeric:tabular-nums}
.cmp .i{width:12px;height:12px;color:var(--ink3)}
.term{background:#eef0f4;color:var(--ink);border-radius:4px;padding:0 4px;margin:0 1px;font-weight:500}
.aside{color:var(--ink3);font-size:.93em}
/* 括号贴着短标签：括号和标签不折开；全角括号字形两边的空白（--po-l / --po-r / --pc-l / --pc-r，按当前字体量出来的 em 值）收到只剩 2px */
.aside .pgl{white-space:nowrap}
.aside .pgl>.tk{max-width:calc(100% - 1.6em)}
.aside .pgo{margin:0 calc(2px - var(--pgo-r,0em)) 0 calc(2px - var(--pgo-l,0em))}
.aside .pgc{margin:0 calc(2px - var(--pgc-r,0em)) 0 calc(2px - var(--pgc-l,0em))}
.tk{display:inline-flex;align-items:center;gap:4px;vertical-align:-3px;max-width:26ch;height:1.6em;padding:0 6px;border:0;border-radius:5px;background:#eef0f4;color:var(--ink2);font:500 12px/1.6 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-decoration:none}
.tk .i{width:11px;height:11px;flex:none}
.tk:hover{background:#e3e6ec;color:var(--ink)}
a.tk{color:var(--blue);font-family:var(--font);font-weight:650}
code.tk{cursor:text}
/* 会话 ID / 路径 / 提交号的短标签：页面里有这个会话的是蓝字（点了跳到会话详情），其余灰底点了复制；完整内容在悬停 / 聚焦时的浮层里 */
.tk .tl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tk.go{color:var(--blue)}
.tk.go:hover{background:#e2eafb;color:var(--blue2)}
.tip{position:fixed;z-index:60;max-width:min(380px,calc(100vw - 16px));padding:7px 10px 8px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;line-height:1.5;box-shadow:0 8px 24px -8px rgba(16,18,22,.45);pointer-events:none;animation:fade .12s ease both}
.tip b{display:block;margin-bottom:2px;font-weight:650;overflow-wrap:anywhere}
.tip code{display:block;font:500 12px/1.5 var(--mono);color:#d5dae2;word-break:break-all;white-space:pre-line}
.tip span{display:block;color:#d5dae2;white-space:pre-line}
.tip small{display:block;margin-top:4px;font-size:12px;color:#a1a1aa;white-space:pre-line}
.tip[hidden]{display:none}
.wlt{display:inline-flex;width:48px;height:6px;border-radius:3px;overflow:hidden;vertical-align:1px;margin:0 5px 0 2px;gap:1px}
.wlt i{display:block;height:100%}
.wlt .w{background:var(--ink)}.wlt .l{background:var(--ink4)}.wlt .t{background:#d9dde3}
.rt{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.mt{display:inline-block;width:36px;height:5px;border-radius:3px;background:var(--track);overflow:hidden;vertical-align:1px}
.mt i{display:block;height:100%;background:var(--ink2);border-radius:3px}
.mt.hot i{background:var(--amber2)}
.pro,.con{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;flex:none;margin-top:3px}
.pro{background:#e9edf3;color:var(--ink)}.con{background:var(--asoft);color:var(--amber)}
.pro .i,.con .i{width:10px;height:10px;stroke-width:2.4}

.lk{display:inline-block;margin-right:8px;padding:0 7px;border-radius:5px;background:var(--ink);color:#fff;font-size:12px;font-weight:650;line-height:20px;vertical-align:2px}

/* 正文：数字拎到上面成卡，句子变成带图标的事实行 */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:0 0 16px}
.kpi{min-width:0;padding:10px 12px 11px;border-radius:11px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line2)}
.kpi .kl{font-size:12px;font-weight:650;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv{margin-top:3px;font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv small{margin-left:3px;font-size:12px;font-weight:650;letter-spacing:0;color:var(--ink3)}
.kpi .kw{font-size:12px;font-weight:650;color:var(--ink3);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.kpi .kw .i{width:11px;height:11px}
.kpi .bars{display:grid;gap:3px;margin-top:8px}
.kpi .bars i{display:block;height:5px;border-radius:3px;background:var(--ink4);transform-origin:left center}
.kpi .bars i.nw{background:var(--ink)}
.kpi .wl{display:flex;gap:2px;height:6px;margin-top:8px;border-radius:3px;overflow:hidden}
.kpi .wl i{display:block;height:100%;transform-origin:left center}
.kpi .wl .w{background:var(--ink)}.kpi .wl .l{background:var(--ink4)}.kpi .wl .t{background:#d9dde3}
.kpi .tr{position:relative;height:6px;margin-top:8px;border-radius:3px;background:var(--track)}
.kpi .tr>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink2);transform-origin:left center}
.kpi .tr>b{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.kpi.hot .tr>i{background:var(--amber2)}
.kpi.hot .kv{color:var(--amber)}
.kpi.run .tr>i{background:var(--blue)}
.kpi .dots{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}
.kpi .dots i{width:14px;height:5px;border-radius:2px;background:var(--track)}
.kpi .dots i.d{background:var(--ink2)}.kpi .dots i.p{background:var(--blue)}.kpi .dots i.p.live{animation:pulse 2s ease-in-out infinite}
/* 事实行：图标块 | 标签 | 句子 三列；下文（.fsub）用 subgrid 共用这三列：符号在图标块那一列、以它的竖直中线为轴居中，文字从第一句的左边缘起 */
.facts{margin:0 0 6px;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.fact{display:grid;grid-template-columns:24px 58px minmax(0,1fr);gap:0 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line2)}
.fact.nl{grid-template-columns:24px minmax(0,1fr)}
.fi{position:relative;width:24px;height:24px;border-radius:7px;background:#eff1f4;color:var(--ink3);display:grid;place-items:center}
.fi .i{width:13px;height:13px}
.fi>.cref{left:1px;top:1px}
.fl{padding-top:3px;font-size:12px;font-weight:650;color:var(--ink3);line-height:1.4}
.ft{font-size:14px;line-height:1.65;color:var(--ink2);padding-top:1px}
.fact.you .fi{background:var(--blue);color:#fff}
.fact.you .ft{color:var(--ink)}
.fact.ask .fi{background:var(--bsoft);color:var(--blue)}
.fact.lead .ft{font-size:15px;font-weight:500;color:var(--ink)}
/* 下文：现状 / 结果、决定说明的第一句以后，每句一行（14 / 400 ink2）；前面的符号按类型（DESIGN.md 第 5 节的表，text-split.mjs rowKinds 判），12px 线条、不加底；「标签：」写成行内粗体 */
.fsub{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:5px;list-style:none;margin:10px 0 1px;padding:0;font-size:14px;font-weight:400;line-height:1.65;color:var(--ink2)}
.fsub>li{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:start}
.fsub>li>.fsy{position:relative;grid-column:1;justify-self:center;display:grid;place-items:center;width:22px;height:23px;color:var(--ink3)}
.fsub>li>.fsy .i{width:12px;height:12px}
.fsub>li>.fsy>.cref{left:0;top:.5px}
.fsub>li>.fst{grid-column:-2;min-width:0;text-wrap:pretty}
.ft{text-wrap:pretty}
.fsub .mk{width:5px;height:5px;border-radius:50%;background:var(--ink4)}
.fsub .mn{font-size:12px;font-weight:650;line-height:23px;color:var(--ink3)}
.fsub li.fk-con>.fsy,.fsub li.fk-warn>.fsy{color:var(--amber)}
.fsub li.fk-ask>.fsy,.fsub li.fk-you>.fsy{color:var(--blue)}
.fsub li.fk-pro>.fsy .i,.fsub li.fk-con>.fsy .i{stroke-width:2}
.fsub .fk{font-weight:650;color:var(--ink2)}
/* 悬停到复制按钮时这一句底色变浅灰（同待办、时间线） */
.fsub>li:has(>.fsy>.cref:hover)>.fst,.fact:has(>.fi>.cref:hover)>.ft{background:var(--sunk);border-radius:4px;box-shadow:0 0 0 3px var(--sunk)}
/* 字体分工（DESIGN.md 第 4 节）：标识符和命令等宽、引用原话楷体 */
/* 行内块：比一行短的整体换行、不在连字符处断开；比一行还长的才在里面断 */
.idf{display:inline-block;max-width:100%;font-family:var(--mono);font-size:.9em;font-weight:400;color:inherit;overflow-wrap:anywhere}
.quo{font-family:var(--quote);color:var(--ink)}
.stpn{white-space:nowrap}

/* 附件 */
.att{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.thumb{position:relative;width:132px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);cursor:zoom-in;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .3s var(--ease)}
.thumb:hover img{transform:scale(1.04)}
.thumb span{position:absolute;left:0;right:0;bottom:0;padding:12px 7px 4px;font-size:11px;font-weight:650;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alink{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:650;text-decoration:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alink:hover,.aw:has(>.cref:hover)>.alink{border-color:var(--bline);color:var(--blue)}
button.alink{cursor:pointer;font-family:inherit}
.att .als{display:contents}
.att .ths{display:contents}
/* 单栏：附件排在数字卡后面、事实行前面（placeAtt 挪过来）；数字卡排成好几行时（窄栏）只留第一行在附件前面，其余的卡排在附件后面（.kpis.more）。
   缩略图只排一行，放不下就横向滚（细滚动条；滚动容器会裁掉外面的焦点框，键盘焦点框画在缩略图里面），结果最多往下挪一行缩略图；链接跟在后面，排不下另起一行 */
/* 和时间线「更早 N 轮」按钮的 .more 同名：盖掉它的高度、flex、边距（不然第二排卡被压成 28px 高，叠在事实行上） */
.bB>.kpis.more{display:grid;height:auto;margin:0 0 16px;padding:0;color:inherit;font-size:inherit;font-weight:inherit;border-radius:0;cursor:auto;background:none}
.bB>.att{margin:0 0 16px;align-items:flex-start}
.bB>.att>.ths{display:flex;gap:8px;max-width:100%;min-width:0;overflow-x:auto;overscroll-behavior-x:contain}
.bB>.att>.ths>.thumb:focus-visible{outline-offset:-2px}
.bB>.att>.ths>.thumb{flex:none}
/* 附件文档：在详情区里看。看文档时详情区加高（窄屏让出左栏），正文按阅读排版；右栏够宽时右侧放目录，否则目录收进按钮 */
/* 看文档时的详情区高度另记（--dvh，分隔条在看文档时调的是它）；没调过就加高到分隔条的上限：会话区留 140（矮屏 30%），同 hRange */
.app.doc:not(.shut) .detail{height:var(--dvh,calc(100vh - 46px - min(140px,(100vh - 46px) * .3)))}
@media (max-width:760px){.app.doc .detail{grid-template-columns:0 0 minmax(0,1fr)}.app.doc .left{visibility:hidden;border-right:0}.app.doc .vsplit{visibility:hidden}}
/* 「我的」窄屏两层（2026-11-03，第 4 轮）：列表占满详情区；点开待办 / 目标后详情占满，顶上一条「返回」回到列表。宽屏仍是左栏列表 + 右栏详情 */
.mn-bk{display:none}
@media (max-width:760px){
 .app.mine2:not(.mdet) .detail{grid-template-columns:minmax(0,1fr) 0 0}.app.mine2:not(.mdet) .right,.app.mine2 .vsplit{visibility:hidden}.app.mine2:not(.mdet) .left{border-right:0}
 .app.mdet .detail{grid-template-columns:0 0 minmax(0,1fr)}.app.mdet .left{visibility:hidden;border-right:0}
 /* 换层不做过渡：「减少动态」把所有元素的过渡时长改成 .01ms，visibility 也会跟着过渡一下，换回列表的那一帧左栏还算隐藏、拿不到焦点 */
 .app.mine2 .left,.app.mine2 .right{transition-property:none}
 .app.mdet .mn-bk{position:sticky;top:-18px;z-index:5;display:flex;align-items:center;gap:6px;height:44px;margin:-18px calc(var(--rp) * -1) 12px;padding:0 calc(var(--rp) - 8px);background:var(--panel)}
 .mn-bk .ghost{color:var(--ink);padding:0 10px 0 6px;flex:none}
 .mn-bk .mn-bkt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--ink3)}
 /* 详情那一层右栏占满（约 420），宽过第 9.3 节的 400 门槛，按钮行却同样占掉大半行宽：同样用贴底的实底条，不让正文从按钮缝里漏出来 */
 .app.mdet .rfoot{--float:0 0 0 transparent;padding-top:8px;padding-bottom:10px;background:var(--panel);box-shadow:0 -1px 0 var(--line2);pointer-events:auto}
 /* 关键结果：标题单独一行，下一行 72px 小条 + 「a / b」（第 10 节的小条宽度） */
 .app.mdet .mn-krs{grid-template-columns:72px minmax(0,1fr);gap:2px 10px}.app.mdet .mn-krs .mn-kt{grid-column:1/-1}.app.mdet .mn-krs .mn-bar{grid-column:1}.app.mdet .mn-krs .mn-v{grid-column:2;grid-row:auto;justify-content:flex-start}.app.mdet .mn-krs li+li .mn-kt{margin-top:14px}
}
/* 触屏上完成圆圈看起来 18px，可点范围扩到约 40px（点偏了不会误开详情） */
@media (pointer:coarse){button.mn-ck{position:relative}button.mn-ck::after{content:"";position:absolute;inset:-11px}
}
.rbody.docm{padding:0 var(--rp) 48px}
.dvbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:48px;margin:0 calc(var(--rp) * -1) 0;padding:0 calc(var(--rp) - 8px);background:var(--panel);border-bottom:1px solid var(--line2)}
.dvbar .dvback{color:var(--ink);padding:0 10px 0 6px}
.dvbar .dvt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden;white-space:nowrap}
.dvbar .dvt b{flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:650;color:var(--ink)}
.dvbar .dvt .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500;color:var(--ink3)}
.dvmenu{position:absolute;top:44px;right:calc(var(--rp) - 8px);width:min(320px,calc(100% - 24px));max-height:min(60vh,calc(var(--rbh,400px) - 60px));overflow:auto;padding:6px;border-radius:12px;background:var(--panel);box-shadow:0 14px 34px -12px rgba(16,18,22,.32),0 0 0 1px var(--line);animation:rise .18s var(--ease) both}
.dvmenu[hidden]{display:none}
.dvmenu a,.dvrail a{display:block;padding:6px 10px;border-radius:7px;color:var(--ink2);font-size:13px;line-height:1.45;text-decoration:none}
.dvmenu a.lv3,.dvrail a.lv3{padding-left:22px;font-size:12px;color:var(--ink3)}
.dvmenu a:hover,.dvrail a:hover{background:var(--hover);color:var(--ink)}
.dvmenu a.on,.dvrail a.on{color:var(--blue);background:var(--bsoft)}
.dvrail a:focus-visible,.dvmenu a:focus-visible{outline-offset:-2px}
.dvst{display:flex;align-items:center;gap:6px;padding:22px 0;color:var(--ink3);font-size:13px}
.dverr{max-width:640px;margin:22px 0;padding:14px 16px;border-radius:11px;background:var(--sunk);border:1px solid var(--line);animation:rise .3s var(--ease) both}
.dverr .h:focus{outline:none}
.dverr .h{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:650;color:var(--ink);line-height:1.5}
.dverr .h .i{color:var(--amber);margin-top:3px}
.dverr p{margin:4px 0 0 22px;font-size:13px;color:var(--ink2)}
.dverr .pa{display:flex;align-items:center;gap:8px;margin:12px 0 0 22px;min-width:0}
.dverr code{flex:1;min-width:0;padding:4px 8px;border-radius:6px;background:#eceef2;color:var(--ink2);font:12px/1.6 var(--mono);overflow-wrap:anywhere}
.dverr .cp{flex:none}
.dverr .ghost:hover{background:#e6e9ed}
/* 网页附件：沙箱 iframe 铺满右栏余下的高度（框里自己滚），左右贴边 */
.rbody.docm:has(>.dvframe){display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.rbody.docm>.dvbar{flex:none}
.dvframe{flex:1;min-height:0;display:block;width:calc(100% + var(--rp) * 2);margin:0 calc(var(--rp) * -1);border:0;background:#fff}
.dvmiss{flex:none;display:flex;align-items:flex-start;gap:6px;padding:10px 0;font-size:12px;line-height:1.5;color:var(--ink2)}
.dvmiss .i{color:var(--amber);margin-top:2px}
.dvtext{margin:18px 0 0;padding:14px 16px;border-radius:10px;background:var(--sunk);border:1px solid var(--line2);color:var(--ink);font:12px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
.dvwrap{display:block;padding-top:6px;animation:rise .3s var(--ease) both}
.dvrail{display:none}
@container (min-width:780px){
 .dvwrap.has-toc{display:grid;grid-template-columns:minmax(0,760px) 188px;column-gap:32px;align-items:start}
 .dvrail{display:block;position:sticky;top:60px;max-height:calc(var(--rbh,600px) - 76px);overflow:auto;margin-top:22px;padding:2px 4px 16px 8px;border-left:1px solid var(--line2);-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);mask-image:linear-gradient(#000 calc(100% - 16px),transparent)}
 .rbody:has(.dvwrap.has-toc) .dvtg{display:none}
}
/* 排版：正文 14 / 1.75，标题拉开层级，表格可横向滚动，代码等宽 */
.md{max-width:760px;color:var(--ink2);font-size:14px;line-height:1.75;overflow-wrap:break-word}
.md>:first-child{margin-top:18px}
.md :is(h1,h2,h3,h4,h5,h6){color:var(--ink);line-height:1.4;scroll-margin-top:60px;text-wrap:balance}
.md :is(h1,h2,h3,h4,h5,h6):focus{outline:none}
.md h1{font-size:19px;font-weight:650;margin:22px 0 12px}
.md h2{font-size:15px;font-weight:700;margin:32px 0 10px;padding-top:14px;border-top:1px solid var(--line2)}
.md h3{font-size:14px;font-weight:700;margin:24px 0 8px}
.md :is(h4,h5,h6){font-size:13px;font-weight:650;color:var(--ink3);margin:20px 0 6px}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md .dvtbl{margin:0 0 12px}
.md ul,.md ol{padding-left:1.5em}
.md li+li{margin-top:3px}
.md li>p{margin:0}
.md li::marker{color:var(--ink4)}
.md strong{color:var(--ink);font-weight:650}
.md a{color:var(--blue);text-decoration:underline;text-decoration-color:var(--bline);text-underline-offset:3px}
.md a:hover{text-decoration-color:currentColor}
.md code{padding:1px 5px;border-radius:5px;background:#eef0f4;color:var(--ink);font:12px/1.6 var(--mono)}
.md pre{padding:12px 14px;border-radius:9px;background:var(--sunk);border:1px solid var(--line2);overflow:auto}
.md pre code{padding:0;background:none;font-size:12px;line-height:1.65;color:var(--ink)}
.md blockquote{padding:8px 14px;border-radius:9px;background:var(--sunk);color:var(--ink3)}
.md blockquote>:last-child{margin-bottom:0}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md hr+h2{border-top:0;padding-top:0}
.md img{display:block;max-width:100%;height:auto;margin:6px 0;border-radius:8px;border:1px solid var(--line2)}
.md .tk{vertical-align:-2px}
.dvtbl{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:linear-gradient(90deg,var(--panel) 30%,rgba(255,255,255,0)) left/24px 100% no-repeat local,linear-gradient(270deg,var(--panel) 30%,rgba(255,255,255,0)) right/24px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(16,18,22,.14),transparent) left/10px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(16,18,22,.14),transparent) right/10px 100% no-repeat scroll}
.dvtbl:focus-visible{outline-offset:1px}
.md table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.55;font-variant-numeric:tabular-nums}
.md th,.md td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
.md th+th,.md td+td{border-left:1px solid var(--line2)}
.md th{color:var(--ink);font-weight:650;white-space:nowrap;border-bottom-color:var(--line)}
.md tr:last-child td{border-bottom:0}
.md td{min-width:5em}
.md th[align=right],.md td[align=right]{text-align:right}
.md th[align=center],.md td[align=center]{text-align:center}
.imerr{display:flex;align-items:flex-start;gap:8px;margin:6px 0;padding:10px 12px;border-radius:9px;background:var(--sunk);border:1px dashed var(--line);color:var(--ink);font-size:13px;line-height:1.5}
.imerr .i{color:var(--amber);margin-top:3px}
.imerr small{display:block;color:var(--ink3);font-size:12px}
.lbx .imerr{background:#fff;max-width:min(420px,88vw)}
.thumb.bad{cursor:default;display:grid;place-items:center}
.thumb .bd{position:static;display:flex;align-items:center;gap:5px;padding:0;background:none;color:var(--ink3);font-size:12px;font-weight:650}
.thumb .bd .i{color:var(--amber)}
@container (max-width:520px){
 .rbody.docm{--rp:16px}
 .dvbar .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 .dvbar .dvt b{max-width:none;flex:0 1 auto}
 .dvbar .dvt b~.fn{display:none}
 .dvbar .dvtg,.dvbar .dvcp{width:var(--h-sm);padding:0;justify-content:center}
 .md{font-size:14px;line-height:1.72}
 .md ul,.md ol{padding-left:1.25em}
 .md th,.md td{padding:6px 8px}
 .dverr .pa{flex-direction:column;align-items:stretch}
 .dverr .cp{align-self:flex-start}
}

/* 视觉类的待验收轮次（visual）：截图在正文最上面。第一张大图，高到详情区放得下为止：横图整张缩进来；竖图按原宽（不超过栏宽）显示、从下面裁掉，裁掉时底边渐隐；点开看全图。
   其余截图：右栏够宽时竖排在大图右边，窄时一行排在大图下面（大图让出这一行的高度）。
   --shot-h 按「标题一行」估；标题折行、标签行带日期折成两行时由 fitShots() 按实际位置量出 --shot-fit 再压低；窄栏里一行要压低时和竖排在大图右边（.side）比，
   取大图显示得更大的（按显示倍数比，见 fitShots） */
.shots{--shot-h:min(var(--shot-fit,1e4px),max(160px,calc(var(--dh,clamp(340px,56vh,620px)) - 210px)));display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;margin:0 0 20px}
.shot{min-width:0;max-width:100%;margin:0}
.shot .sf{position:relative;display:block;width:fit-content;max-width:100%;max-height:var(--shot-h);overflow:hidden;padding:0;border:0;border-radius:10px;background:var(--sunk);color:inherit;font:inherit;text-align:left;cursor:zoom-in;transition:box-shadow .16s}
/* 边框画在图上面（不用外圈阴影）：裁掉时底边的渐隐把边框一起淡掉，看得出下面还有；强制颜色模式下边框也在 */
.shot .sf::before{content:"";position:absolute;inset:0;z-index:1;border:1px solid var(--line);border-radius:inherit;pointer-events:none;transition:border-color .16s}
.shot:not(.ok):not(.bad){width:480px}
.shot:not(.ok):not(.bad) .sf{width:100%;height:var(--shot-h)}
.shot img{display:block;max-width:100%;max-height:var(--shot-h);height:auto}
.shot.tall img{max-height:none}
.shot.cut .sf::after{content:"";position:absolute;left:0;right:0;bottom:0;z-index:2;height:72px;background:linear-gradient(rgba(255,255,255,0),var(--panel) 88%);pointer-events:none}
.shot button.sf:focus-visible{border-radius:10px}
.shot button.sf:hover::before{border-color:var(--bline)}
.shot:not(.cut) button.sf:hover{box-shadow:0 10px 24px -14px rgba(21,23,27,.35)}
.shot .zm{position:absolute;z-index:3;right:8px;bottom:8px;display:grid;place-items:center;width:var(--h-sm);height:var(--h-sm);border-radius:8px;background:rgba(21,23,27,.72);color:#fff;transition:background .16s}
.shot .sf:hover .zm,.shot .sf:focus-visible .zm{background:rgba(21,23,27,.86)}
.shot .cap{display:block;width:0;min-width:100%;margin-top:8px;font-size:12px;font-weight:500;line-height:1.5;color:var(--ink3)}
/* 打不开：图的位置写服务端给的原因（同附件缩略图、文档里的图，见「图片打不开」），这时没有按钮 */
.shot.bad .sf{background:none;overflow:visible;cursor:default}
.shot.bad .sf::before{content:none}
.shot.bad .imerr{margin:0}
/* 其余截图只占一行（窄）或一列（宽，不比大图框高），多了在里面滚动，不排到按钮底下；4px 内边距留给聚焦圈 */
.shots .srest{display:flex;gap:8px;flex:1 0 calc(100% + 8px);padding:4px;margin:-4px;overflow-x:auto}
.shots .srest>.thumb{flex:none}
@container (min-width:600px){
 .shots:has(>.srest){flex-wrap:nowrap}
 .shots:has(>.srest)>.shot{max-width:calc(100% - 152px)}
 .shots>.srest{flex:none;flex-direction:column;max-height:var(--srest-h,calc(var(--shot-h) + 8px));overflow:hidden auto;scrollbar-gutter:stable}
}
@container (max-width:599.98px){
 .shots:has(>.srest){--shot-h:min(var(--shot-fit,1e4px),max(96px,calc(var(--dh,clamp(340px,56vh,620px)) - 306px)))}
 .shots.side:has(>.srest){--shot-h:min(var(--shot-fit,1e4px),max(160px,calc(var(--dh,clamp(340px,56vh,620px)) - 210px)));flex-wrap:nowrap}
 .shots.side:has(>.srest)>.shot{max-width:calc(100% - 152px)}
 .shots.side>.srest{flex:none;flex-direction:column;max-height:var(--srest-h,calc(var(--shot-h) + 8px));overflow:hidden auto;scrollbar-gutter:stable}
}

/* 选项 */
.sec-h{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:12px;font-weight:650;color:var(--ink3)}
.sec-h .ln{flex:1;height:1px;background:var(--line2)}
.opts{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.opt{position:relative;display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px 12px 38px;cursor:pointer;transition:border-color .14s,background .14s,box-shadow .2s,transform .2s var(--ease)}
.opt:hover{border-color:#c9ced6;box-shadow:0 2px 10px -4px rgba(16,18,22,.12)}
.opt:active{transform:scale(.99)}
.opt .rd{position:absolute;left:12px;top:13px;width:17px;height:17px;border-radius:50%;border:1.5px solid #bfc5ce;display:grid;place-items:center;background:#fff;transition:background .14s,border-color .14s}
.opt .rd .i{width:11px;height:11px;stroke:#fff;stroke-width:2.6;opacity:0}
.opt.on{border-color:var(--blue);background:var(--bsoft);box-shadow:0 0 0 1px var(--blue)}
.opt.on .rd{background:var(--blue);border-color:var(--blue)}
.opt.on .rd .i{opacity:1;animation:pop .22s var(--ease)}
.opt .ol{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:650;line-height:1.4;color:var(--ink)}
.rec{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:5px;background:var(--bsoft);color:var(--blue);font-size:11px;font-weight:650}
.opt.on .rec{background:#fff}
.rec .i{width:10px;height:10px;fill:currentColor;stroke:none}
.opt .oe{margin-top:5px;font-size:12px;line-height:1.6;color:var(--ink2)}
.opt .oe ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.opt .oe li{display:flex;gap:6px}
.costs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.cost{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:5px;background:#eef0f4;color:var(--ink2);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.cost .i{width:11px;height:11px}
.opt.on .cost{background:#fff}
.scope{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--ink3);font-weight:650;flex-wrap:wrap;animation:rise .24s var(--ease) both}
.scope input{height:28px;border:1px solid var(--line);border-radius:7px;padding:0 9px;font:inherit;font-size:12px;min-width:220px;outline:none}
.scope input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--bsoft)}

/* 输入项：默认是置灰的小条，点开成一行输入框 */
.note{margin-top:10px}
.note-p{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 12px;border:0;border-radius:8px;background:#eef0f3;color:var(--ink3);font-size:12px;font-weight:500;cursor:text;transition:background .14s,color .14s}
.note-p:hover{background:#e6e9ed;color:var(--ink2)}
.note-p .i{width:12px;height:12px}
.note-p.q{height:var(--h-md);padding:0 14px;background:var(--bsoft);color:var(--blue);font-size:13px;font-weight:650}
.note-p.q:hover{background:#e2eafb}
.note-i{display:block;width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none;transform-origin:left center;animation:grow-x .24s var(--ease) both;transition:border-color .14s,box-shadow .14s}
.note-i:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--bsoft)}
.note-i.filled{border-color:var(--bline);background:#fbfcff}
.ifnone{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--ink3)}
.ifnone .i{width:12px;height:12px}

/* 顺便问：轮次详情里一节（问答列表 + 「顺便问一句」）、会话小卡标题行和时间线里的气泡、决定栏里的答案卡。
   不用琥珀、不带风险标和蓝色数字（蓝色数字是待决定数）；状态标记 ink3，只有「有新答案」是蓝点 / 蓝气泡 */
.bw{display:inline-flex;align-items:center;gap:3px;flex:none;color:var(--ink3);font-size:12px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.bw .i{width:13px;height:13px}
.bw.new .i{color:var(--blue)}
.bw.wait{color:var(--ink2)}
.bw .bt{white-space:nowrap}
.sc-m .bwn{color:var(--ink2);white-space:nowrap}
@container (max-width:170px){.rr .k{white-space:nowrap}.rr .k .bw .bx,.rr .k .bw+.tm{display:none}}
.sc-t .bw{margin-bottom:2px}
.rr .k .bw{margin-left:auto}
.rr .k .bw+.tm{margin-left:8px}
.btw{margin-top:22px}
.btw-h{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:12px;font-weight:650;color:var(--ink3)}
.btw-h .i{width:13px;height:13px}
.btw-h .c{font-variant-numeric:tabular-nums}
.bql{list-style:none;margin:0;padding:0}
.bq{display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.bq:last-child{border-bottom:0}
.bq .bs{display:grid;place-items:center;width:24px;height:21px}
.bq .bs i{display:block;width:8px;height:8px;border-radius:50%}
.bq.wait .bs i{border:1.5px solid var(--ink3)}
.bq.read .bs i{background:var(--ink3)}
.bq.new .bs i{background:var(--blue);box-shadow:0 0 0 3px var(--bsoft)}
.bq.end .bs i{width:9px;height:2px;border-radius:1px;background:var(--ink3)}
.bq .q{font-size:14px;font-weight:650;line-height:1.5;color:var(--ink);overflow-wrap:anywhere;white-space:pre-line}
.bq.end .q{color:var(--ink3)}
.bq .a{margin-top:3px;font-size:14px;line-height:1.65;color:var(--ink2);text-wrap:pretty;overflow-wrap:anywhere;white-space:pre-line}
.bq .m{display:flex;flex-wrap:wrap;gap:0 8px;margin-top:3px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bq .m .nw{color:var(--blue2);font-weight:650}
.bq .fu{margin-top:10px;padding-left:12px;border-left:1px solid var(--line)}
.bq .fu .q{font-size:13px}
.bq .fu .a{font-size:13px}
.batt{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bask{margin-top:8px}
.bact{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.bbtn{display:inline-flex;align-items:center;gap:5px;height:var(--h-sm);padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);font:inherit;font-size:12px;font-weight:650;cursor:pointer;transition:background .14s,border-color .14s,color .14s}
.bbtn .i{width:12px;height:12px}
.bbtn:hover{background:var(--hover);color:var(--ink)}
.bbtn:disabled{cursor:default;color:var(--ink4);background:#fff}
.bbtn.on{border-color:var(--bline);background:var(--bsoft);color:var(--blue2)}
.bact .note-i{flex:1 1 100%;margin-top:2px}
.berr{flex:1 1 100%;font-size:12px;color:var(--red);font-weight:650}
/* 决定栏的答案卡：和决定分开成一组，灰底白卡、没有风险标和截止，按钮是「了解」「继续追问」 */
.bwg{margin-top:14px;padding:10px 0 0;border-top:1px solid var(--line2)}
.bwg>h3{display:flex;align-items:center;gap:7px;margin:0 6px 6px;font-size:12px;font-weight:650;color:var(--ink3);line-height:1.4;min-width:0}
.bwg>h3 .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bwg>h3 .i{width:13px;height:13px;flex:none}
.bwg>h3 .c{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}
.bcard{background:var(--sunk);border-radius:9px;padding:8px 10px 6px;margin-top:5px}
.bcard:first-of-type{margin-top:0}
.bcard .bgo{display:block;width:100%;padding:0;border:0;background:none;font:inherit;text-align:left;color:inherit;cursor:pointer}
.bcard .bs2{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;font-weight:650;color:var(--ink3)}
.bcard .bs2 .i{width:12px;height:12px;flex:none}
.bcard .bs2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bs2 .tm{margin-left:auto;flex:none;font-weight:500;font-variant-numeric:tabular-nums}
.bcard .bq2{margin-top:4px;font-size:13px;font-weight:650;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .ba{margin-top:3px;font-size:13px;line-height:1.55;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bcard .bgo:hover .bq2{color:var(--blue)}
.bcard .bact{margin-top:4px;margin-left:-8px;gap:2px}
.bcard .bbtn{border-color:transparent;background:transparent;color:var(--ink2)}
.bcard .bbtn:hover{background:var(--hover);color:var(--ink)}
.bcard .bbtn.on{border-color:transparent;background:var(--bsoft);color:var(--blue2)}
.bbtn[aria-busy="true"]{color:var(--ink3);cursor:progress}
.berr code{font:12px/1.5 var(--mono);font-weight:500;overflow-wrap:anywhere}
/* 今日推荐：决定栏里另成一组（和顺便问的回答同一套卡）；选了的卡白底加描边，和未选的分开 */
.rwg{margin-top:14px}
.rcard{border:1px solid transparent}
.rcard.picked{background:#fff;border-color:var(--line)}
.rcard .rec-t{font-size:13px;font-weight:650;line-height:1.45;color:var(--ink)}
.rcard .rec-b{margin-top:3px;font-size:13px;line-height:1.55;color:var(--ink2);overflow-wrap:anywhere}
.bcard .bbtn.no.on{background:var(--hover);color:var(--ink)}
.rcn{display:inline-flex;align-items:center;gap:3px;margin-left:4px;color:var(--ink3);font-size:12px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.rcn .i{width:12px;height:12px}
/* 须知：决定栏里另成一组（和顺便问的回答同一套卡）；提醒级标题前一个琥珀三角。已了解的在「已处理」最后折叠成一组 */
.ncard .nt{font-size:13px;font-weight:650;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.ncard .nt .i{width:13px;height:13px;margin-right:5px;vertical-align:-2px;color:var(--amber)}
.ncard .nb{margin-top:3px;font-size:13px;line-height:1.55;color:var(--ink2);overflow-wrap:anywhere}
.ncard .att{margin-top:8px;gap:6px}
.ncard .alink,.ncard .tk{max-width:100%}
.nkh{display:flex;align-items:center;gap:7px;width:100%;height:var(--h-sm);padding:0 6px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:12px;font-weight:650;color:var(--ink3);cursor:pointer;text-align:left;min-width:0}
.nkh:hover{background:var(--hover);color:var(--ink2)}
.nkh .i{width:13px;height:13px;flex:none}
.nkh .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nkh .c{margin-left:auto;font-variant-numeric:tabular-nums}
.nkl{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.nk{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1px 8px;padding:7px 4px 7px 10px;border-radius:9px;background:var(--sunk)}
.nk .nkt{font-size:13px;font-weight:650;line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nk .tm{grid-column:1;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nk .bbtn{grid-column:2;grid-row:1/span 2;border-color:transparent;background:transparent}
.nk .bbtn:hover{background:var(--hover);color:var(--ink)}
.nk .berr{grid-column:1/-1}
.seg .bw{margin-left:4px}
.lhead{container-type:inline-size}
/* 左栏窄时：页签里的气泡缩成 6px 蓝点；答案卡顶行会话名占一行、时间换到下一行；决定行的剩余时间换到标题下面（标题不被挤没） */
.seg button{min-width:0}
@container (max-width:260px){.seg button{padding:0 6px;gap:4px}.seg .bw{margin-left:0}.seg .bw .i{display:none}.seg .bw::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}}
@container (max-width:200px){.bcard .bs2{flex-wrap:wrap}.bcard .bs2>.i{display:none}.bcard .bs2 .tm{margin-left:0;flex-basis:100%}}
@container (max-width:200px){.dr{grid-template-columns:14px minmax(0,1fr)}.dr .r{grid-column:2}}
@container (max-width:136px){.sc-t .bw:not(.new,.wait){display:none}}
/* 左栏窄时页签放不下推荐数：只留决定数（推荐组标题上有条数） */
@container (max-width:260px){.seg .rcn{display:none}}

/* 回执 */
.rcpt{display:flex;align-items:center;gap:10px;margin-top:20px;padding:12px 14px;border-radius:11px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;line-height:1.55;color:var(--ink2)}
.rcpt>.i{width:18px;height:18px;flex:none;color:var(--ink3)}
.rcpt b{color:var(--ink);font-weight:650}
.rcpt .tm{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:4px}
.rcpt .ghost{margin-left:auto;color:var(--blue);flex:none}
.rcpt.auto{background:var(--asoft);box-shadow:inset 0 0 0 1px var(--aline)}
.rcpt.auto>.i{color:var(--amber)}
.rcpt.done>.i{color:var(--ink)}

/* 轮次：用时条、待办、错误框、操作 */
.todos{margin-top:20px;container-type:inline-size}
.todos ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;column-gap:8px;row-gap:2px}
.todos li{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:start;padding:5px 6px;border-radius:7px;font-size:13px;line-height:1.5;color:var(--ink2)}
.todos li.done{color:var(--ink3)}
.todos li.done .tx{text-decoration:line-through;text-decoration-color:#c5c9d0}
.todos li.cur{background:var(--bsoft);color:var(--ink)}
.todos .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid #c3c8d0;margin-top:2px;display:grid;place-items:center}
.todos li.done .ck{background:var(--ink4);border-color:var(--ink4)}
.todos li.done .ck .i{width:9px;height:9px;stroke:#fff;stroke-width:2.6}
.todos li.cur .ck{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 0 3px,transparent 3.5px)}
.todos .et{display:contents}
.todos .ac,.todos .pd{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:1px;white-space:nowrap}
.todos .ac{grid-column:3}.todos .pd{grid-column:4;padding-left:8px}
.todos .k{margin-right:4px}
.todos .ac b,.todos .pd b{font-weight:inherit;color:var(--ink2)}
.todos li.done .ac b,.todos li.done .pd b{color:var(--ink3)}
.todos .ac.over b,.todos li.done .ac.over b{color:var(--amber);font-weight:650}
.todos li.cur .ac.over b{color:#985800}
.todos .sl{display:none;color:var(--ink4)}
@container (max-width:400px){.todos ol{grid-template-columns:18px minmax(0,1fr)}.todos .et{display:flex;flex-wrap:wrap;gap:0 6px;grid-column:2}.todos .ac,.todos .pd{padding-top:0}.todos .pd{padding-left:0}.todos .sl{display:inline}}
/* 交出去的项（🤖）：文字前机器人图标（推断出来的浅一档；有在跑的子 agent 时蓝）；下面一行是它的子 agent / 后台任务，整行可点，展开看会话 ID 和开始时间 */
.todos .tx .bt{display:inline-flex;vertical-align:-2px;margin-right:5px}
.todos .tx .bt .i{width:13px;height:13px;color:var(--ink3)}
.todos .tx .bt.bt-inf .i{color:var(--ink4)}
.todos .tx .bt.on .i{color:var(--blue)}
.todos .runs{grid-column:2/-1;min-width:0;margin-top:1px;font-size:12px;line-height:1.5;color:var(--ink3)}
.todos .runs summary{display:flex;align-items:center;gap:5px;min-height:24px;margin-left:-5px;padding:1px 5px;border-radius:6px;cursor:pointer;list-style:none;user-select:none}
.todos .runs summary::-webkit-details-marker{display:none}
.todos .runs summary:hover{background:var(--hover)}
.todos .runs summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.todos .runs .i{width:13px;height:13px;flex:none;color:var(--ink3)}
.todos .runs .i.on{color:var(--blue)}
.todos .runs .run{display:flex;align-items:center;gap:5px;min-width:0}
.todos .runs .run-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.todos .runs .sep{flex:none;color:var(--ink4)}
.todos .runs .run-s{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.todos .runs .st-failed .run-s,.todos .runs .st-failed>.i{color:var(--red)}
.todos .runs .st-failed .run-s{font-weight:650}
.todos .runs .st-stopped .run-s{color:var(--ink2)}
.todos .runs .st-stopped>.i{color:var(--ink2);fill:currentColor}
.todos .runs .multi>.i:not(.on){color:var(--ink3);fill:none}
.todos .runs .run-w2{flex:none;color:var(--ink2)}
.todos .runs .run-ic{display:none;align-items:center;gap:8px;flex:none;color:var(--ink2);font-variant-numeric:tabular-nums}
.todos .runs .run-k{display:inline-flex;align-items:center;gap:3px}
.todos .runs .run-k .i{width:12px;height:12px}
.todos .runs .multi>.run-ic~.sep{margin-left:0}
@container (max-width:400px){.todos .runs .multi>.i{display:none}.todos .runs .run-w2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.todos .runs .run-ic{display:inline-flex}}
.todos .runs summary .inf{flex:none;margin:0}
.todos .runs summary .cv{width:13px;height:13px;margin-left:auto;transition:transform .2s var(--ease)}
.todos .runs[open]>summary .cv{transform:rotate(180deg)}
.todos .runs ul{list-style:none;margin:2px 0 4px 1px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.todos .runs ul>li{display:flex;align-items:flex-start;gap:5px;grid-column:auto;padding:3px 0 2px;border-radius:0;font-size:12px;line-height:1.5;color:inherit}
.todos .runs ul>li>.i{margin-top:2px}
.todos .runs .run-b{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:2px}
.todos .runs .run-t{display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;color:var(--ink2)}
.todos .runs .run-t .sep{margin:0}
.todos .runs .run-m{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;white-space:nowrap}
.todos .runs .run-m .tk{min-width:0;max-width:100%}
.todos .runs .run-w{font-variant-numeric:tabular-nums}
.todos li.done .runs .run-n,.todos li.done .runs .run-t{color:var(--ink3)}
/* 点子 agent 那一行打开它的会话：名字悬停蓝色下划线；行里其余地方和右边的箭头仍是展开 */
.todos .runs .run-go{display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;margin:0;padding:0;border:0;border-radius:4px;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.todos .runs .run-go{padding:2px 0}
.todos .runs .run-go .run-n{color:var(--ink2);text-decoration:underline 1px var(--ink4);text-underline-offset:3px;text-decoration-skip-ink:auto}
.todos .runs .run-go:hover .run-n,.todos .runs .run-go:focus-visible .run-n{color:var(--blue);text-decoration-color:currentColor}
.todos .runs .run-go:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.todos .runs summary:has(.run-go:hover){background:none}
.todos .runs .run-x{flex:none;margin:0}
.todos .runs summary:has(>.run-x){flex-wrap:wrap}
.todos .runs summary>.run{flex:0 1 auto}
.todos .runs summary:has(>.run-x)>.run .run-n{min-width:min(8em,100%)}
.todos .run-err{grid-column:2/-1;display:flex;align-items:flex-start;gap:5px;margin:1px 0 0;font-size:12px;line-height:1.5;color:var(--red)}
.todos .run-err .i{width:13px;height:13px;margin-top:2px;flex:none}
.todos .run-err>span{flex:1;min-width:0}
/* 并行组：连续几项 🤖 收进一个白底细框，组头「并行 N 项」（有失败时跟红字「· n 个失败」）+ 组的已用 / 预计（预计按组里最长的一项）；
   组里进行中的底色往里缩 4px，不铺满组框，和单独一项进行中的底色区分开 */
.todos li.pg{padding:0;margin:4px 0;row-gap:0;background:var(--panel);outline:1px solid var(--line);outline-offset:-1px;border-radius:9px}
.todos li.pg>ol{grid-column:1/-1;grid-template-columns:subgrid;padding:0 0 4px}
.todos .pgh{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:start;padding:7px 6px 2px;font-size:12px;color:var(--ink3)}
.todos .pgh .gi{display:grid;place-items:center;width:15px;height:15px;margin-top:2px}
.todos .pgh .gi .i{width:13px;height:13px;color:var(--ink2)}
.todos .pgh .tx{font-weight:650;color:var(--ink2);padding-top:1px}
.todos .pgh .pf{color:var(--red)}
.todos .pgh .pf .sep{margin:0 5px;color:var(--ink4)}
.todos li.pg li{isolation:isolate}
.todos li.pg li.cur{background:none}
.todos li.pg li:is(.cur,.fail)::before{content:"";position:absolute;inset:1px 4px;border-radius:7px;z-index:-1}
.todos li.pg li.cur::before{background:var(--bsoft)}
/* 最近派出的子 agent 失败了：这一项加 1px 红色内描边（待办自己的状态圆点不变） */
.todos li.fail{box-shadow:inset 0 0 0 1px var(--rline)}
.todos li.pg li.fail{box-shadow:none}
.todos li.pg li.fail::before{box-shadow:inset 0 0 0 1px var(--rline)}
.inf{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:500;line-height:17px;color:var(--ink3);vertical-align:1px;white-space:nowrap}
.fact.nt .ft{font-size:13px;color:var(--ink3);padding-top:3px}
.fact.nt .inf{margin:0 6px 0 0}
.fault:not(.rs){margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--rsoft);box-shadow:inset 0 0 0 1px var(--rline)}
.fault:not(.rs) .h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--red)}
.fault pre{margin:6px 0 0;font:12px/1.55 var(--mono);color:#7d1d1d;white-space:pre-wrap;word-break:break-all;max-height:7.8em;overflow:auto}
/* 待验收轮次的工具调用异常：四组，组内同类折叠成一行，展开看每一次 */
.an{margin-top:22px;container-type:inline-size}
.an .sec-h{margin-top:0}
.an .sec-h .c{font-weight:500;font-variant-numeric:tabular-nums}
.an .sa{display:inline-flex;align-items:center;gap:2px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.an .sa .i{width:12px;height:12px}
.an .agh .sa{margin-left:2px}
.an .ct .sa{margin-left:5px;padding-left:5px;box-shadow:inset 1px 0 0 var(--line)}
.an.ws .ct{min-width:6.8em}
.an .oa .in.ag{max-width:14em}
.an .oa .in.ag span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an .oa .in.ag{display:inline-flex;align-items:center;gap:3px;vertical-align:1px}
.an .oa .in.ag .i{width:11px;height:11px}
.an .subr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:14px}
.an .subr .st{padding:0}
.an .subr .fc .i{width:13px;height:13px}
.an .st{display:flex;align-items:center;gap:6px;padding:2px 6px;font-size:12px;color:var(--ink3)}
.an .st .i{width:13px;height:13px}
.an .st.err{color:var(--red)}
.an .ag+.ag,.an .st+.ag,.an .ag+.st{margin-top:12px}
.an .agh{display:flex;align-items:center;gap:6px;padding:0 6px 3px;font-size:12px;font-weight:650;color:var(--ink2)}
.an .agh>.i{width:13px;height:13px;color:var(--ink3)}
.an .ag.error .agh>.i{color:var(--red)}.an .ag.timeout .agh>.i{color:var(--amber)}
.an .agh .n{font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.an ul{list-style:none;margin:0;padding:0}
.an summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto 14px;align-items:center;column-gap:8px;padding:5px 6px;border-radius:7px;font-size:13px;line-height:1.5;color:var(--ink2);list-style:none;cursor:pointer;user-select:none}
.an summary::-webkit-details-marker{display:none}
.an summary:hover{background:var(--hover)}
.an summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.an details[open]>summary{color:var(--ink)}
.an .tn{padding:0 6px;border-radius:5px;background:var(--hover);color:var(--ink);font:500 12px/1.6 var(--mono);white-space:nowrap}
.an .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an .lb.raw{font:12px/1.6 var(--mono)}
.an .ct{grid-column:4;min-width:3.6em;text-align:center;padding:0 6px;border-radius:999px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line2);font-size:12px;line-height:1.6;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.an .ct b{font-weight:650;color:var(--ink2)}
.an .sv{grid-column:3;min-width:84px;justify-content:flex-end;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.an .sv .m{width:32px;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.an .sv .m i{display:block;height:100%;border-radius:2px;background:var(--ink4)}
.an .sv.hot{color:var(--amber)}.an .sv.hot .m i{background:var(--amber2)}
.an summary .cv{grid-column:5;width:14px;height:14px;color:var(--ink3);transition:transform .2s var(--ease)}
.an details[open]>summary .cv{transform:rotate(180deg)}
.an .occ{list-style:none;margin:2px 0 8px 12px;padding:0 0 0 12px;border-left:1px solid var(--line)}
.an .occ li{padding:6px 0;font-size:12px;line-height:1.55;color:var(--ink3)}
.an .occ li+li{border-top:1px solid var(--line2)}
.an .oh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.an .oh time{font-variant-numeric:tabular-nums}
.an .oa{flex:1 1 180px;min-width:0;color:var(--ink2);overflow-wrap:anywhere}
.an .oa .in{margin-right:6px;padding:0 5px;border-radius:5px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line2);font-size:11px;color:var(--ink3);white-space:nowrap}
.an .ov{font-variant-numeric:tabular-nums;white-space:nowrap}
.an .ov b{font-weight:650;color:var(--ink)}
.an .occ pre{margin:5px 0 0;padding:7px 9px;max-height:9.4em;overflow:auto;border-radius:7px;background:var(--sunk);color:var(--ink2);font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.an .ag.error .occ pre{background:var(--rsoft);color:#7d1d1d}
.an .occ .mo{color:var(--ink3)}
/* run_code 的每一步 */
.an .rn{margin:6px 0 0 8px;min-width:0}
.an details,.an .occ,.an .occ>li{min-width:0}
.an .occ>li:has(.rn){padding-bottom:10px}
.an .occ>li:has(.rn)+li,.an .occ>li+li:has(.rn){padding-top:10px;border-top-color:var(--line)}
.an .rnh{display:flex;align-items:baseline;gap:8px;padding:0 6px 2px;color:var(--ink2)}
.an .rnh .tn{font-size:11px}
.an .rnh .rd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-weight:500}

@container (max-width:420px){

/* 操作按钮（34）：同一档高度，四种功能色（确认 / 恢复绿、修改 / 改主意蓝、暂缓琥珀、放弃红）同一套写法——
   默认 = 白底、功能色字和图标、浅功能色描边；悬停 = 浅功能色底、功能色描边；选中（已选、等发送）= 实心功能色底、白字、图标换成勾 */
.btn{--c:var(--ink);--cl:var(--line);--cs:var(--hover);--cd:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-md);padding:0 14px;border-radius:9px;border:1px solid var(--cl);background:var(--face);box-shadow:var(--lift);font-size:13px;font-weight:650;color:var(--c);white-space:nowrap;cursor:pointer;transition:background .14s,border-color .14s,color .14s,box-shadow .2s,transform .12s var(--ease)}

.cio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px 32px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 18px 15px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,18,22,.04)}

/* 宽屏（整页、侧栏全屏，≥ 1280，2026-11-08）：Curio 在会话区左边成一栏、上下排，四个状态列在右边，首屏就看得到会话卡（横着一整块时它占掉会话区首屏的大半）；
   详情区左栏默认收到 30%，右栏在 1440 宽时就够 960、走两栏（拖过分隔条的照存下的宽度） */
@media (min-width:1280px){

}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.8fr);gap:12px;align-items:stretch}

.colh .g.doing{color:var(--blue)}.colh .g.blk{color:var(--amber2)}.colh .g.done{color:var(--ink2)}.colh .g.end{color:var(--ink4)}
.cempty{height:64px;border:1.5px dashed var(--line);border-radius:12px}

.sc{position:relative;display:block;width:100%;margin-top:6px;padding:9px 10px 10px;border:1px solid transparent;border-radius:9px;background:var(--sunk);text-align:left;cursor:pointer;transition:background .14s,border-color .14s,box-shadow .2s}

/* 用时圆环：一圈 = 预计用时；第 1 圈蓝，超出后在满圈上用下一色从头画（黄 → 橙 → 红），满 4 圈后保持满圈红；中间的点数 = 已超出的整圈数 */
/* 四圈对卡底（#f6f7f9 / 悬停 #eef0f3 / 选中 #fff）都在 3:1 以上（2026-10-26 First Mate 定）：第 2 圈黄 #efc02a → #a5810c（同色相加深，1.5 → 3.2:1 起）；
   第 3、4 圈跟着压暗、拉开相邻两圈：橙 #d9590c → #823507、红 #bf2c2c → #611616（同色相）。第 2 圈起越来越暗（明度 L 56 / 33 / 21），
   相邻两圈的亮度对比 1.5 / 2.3 / 1.5:1（第 1↔2、2↔3、3↔4），色弱也能按深浅分；第 4 圈不再借 --red（别处的红不变） */
.ring{flex:none;display:block;width:16px;height:16px;overflow:visible;--lap1:var(--ink3);--lap2:#a5810c;--lap3:#823507;--lap4:#611616}
.ring circle{fill:none;stroke-width:2.2}

/* 动效（DESIGN.md「用时圆环」）：进度变化逐帧只改 stroke-dashoffset；往前跨进新的一圈时一圈新颜色的细环向外散开、圈心点弹一下（只动 transform + opacity）；
   还没拿到回合时间、本机也没记着位置时整个圆环淡着（data-pend=dim）。减少动态效果时不走、不淡入、不提示，只换颜色 */
.ring .dts{transform-origin:8px 8px}
.ring .halo{stroke-width:1.5;opacity:0;transform-origin:8px 8px}
.ring[data-pend="dim"]{opacity:.4}
.sc-m .rg{display:inline-flex}

.sc.run .sc-m .tm{color:var(--blue)}
/* 当前步骤：这一项的「已用 / 预计」在前、不缩，「· 原文」在后、缩成省略号（截断留下的空落在原文和右边整轮时长之间）；和右边整轮的时长至少隔开 12px（自己 5px） */
.sc-m .cur{flex:1 1 0;min-width:0;display:flex;align-items:baseline;gap:4px;margin-right:5px;overflow:hidden;white-space:nowrap;color:var(--ink3)}
.sc-m .cur .ct{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sc-m .cur .ce{flex:none}
.sc-m .cur .ce+.ct::before{content:'· '}
.sc-b{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--panel),0 2px 6px rgba(47,98,214,.35)}
.sc-m{display:flex;align-items:center;gap:7px;margin-top:6px;min-width:0;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sc-m>*{flex:none}
.sc-m .rs{display:inline-flex;align-items:center;gap:4px;font-weight:650}
.sc-m .rs .i{width:12px;height:12px}
.rs.decide{color:var(--amber)}.rs.stopped{color:var(--ink)}.rs.handed{color:var(--ink2)}.rs.fault{color:var(--red)}.rs.info,.rs.paused{color:var(--ink3)}

.sc-m .rp .i{width:11px;height:11px}
.sc-m .tm{margin-left:auto;display:inline-flex;align-items:center;gap:3px}
.ps{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:#e7e9ed;color:var(--ink2)}
.ps .i{width:10px;height:10px;stroke-width:2.2}
/* 卡窄（四栏挤在窄屏里）时按卡宽收，时长不许越出卡边 */
.sc{container-type:inline-size}
.sc-m .tm{white-space:nowrap}
/* 都让完还放不下（暂停图标不让位）：先收紧间距，还不够才截断时长 */

.sc-m.cut>.tm{flex:0 1 auto;min-width:0;gap:2px}
.sc-m .tm .ps{flex:none}
.sc-m .tm .tv{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 时长不缩；当前步骤、阻塞原因文字可缩成省略号；还放不下时 fitMeta() 按优先级给元素加 fit-x 隐藏（悬停时长、进度条刻度仍能看到预计） */
.sc-m>.rs{flex:0 1 auto;min-width:0;overflow:hidden}
.sc-m .rs .i{flex:none}
.sc-m .rs .rt{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@container (max-width:136px){.sc-m{gap:4px}.sc-m .ps{width:13px}}
/* 让位的元素视觉隐藏（脱离排版、读屏仍可读），写法同 .lbl */
.sc-m .fit-x{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 小卡第三行：正在执行的子 agent / 后台任务。两段时各自按内容缩（名字长的那段先省略），图标不缩；卡很窄时多个只留图标 + 数字 */
.sc-w{display:flex;align-items:center;gap:8px;margin-top:6px;min-width:0;font-size:12px;line-height:1.5;color:var(--ink3)}
.sc-w .wk{display:inline-flex;align-items:center;gap:4px;min-width:0;flex:0 1 auto}
/* 两段并排：「n 个…执行中…」本身就是摘要，不缩，让名字那段省略；两段都是名字时各自至少留 4 个字宽 */
.sc-w .wk.m:has(~.wk),.sc-w .wk~.wk.m{flex:none}
.sc-w .wk:not(.m):has(~.wk),.sc-w .wk~.wk:not(.m){min-width:calc(4em + 17px)}
.sc-w .wk .i{width:13px;height:13px;color:var(--ink3)}
.sc.run .sc-w .wk .i{color:var(--blue)}
.sc-w .wt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-w .wn{display:none;font-weight:650;font-variant-numeric:tabular-nums}
.sc-w .wid,.dw .wid{font-family:var(--mono);font-size:12px;font-weight:500}
/* 卡很窄时每段只留图标 + 数字（文字视觉隐藏，读屏仍读；悬停照样列出全部） */
@container (max-width:136px){.sc-w .wk,.sc-w .wk:not(.m):has(~.wk),.sc-w .wk~.wk:not(.m){flex:none;min-width:0}.sc-w .wt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.sc-w .wn{display:inline}}
.sc-m>.rs:has(.rt.fit-x){flex:none}
