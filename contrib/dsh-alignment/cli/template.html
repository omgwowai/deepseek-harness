.pbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink4);transition:width .6s var(--ease)}
.pbar.run>i{background:var(--blue)}
.pbar.run>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sheen 2.4s ease-in-out infinite}
.pbar.blk>i{background:var(--ink3)}
.pbar.hot>i{background:var(--amber2)}
.pbar{overflow:visible}
.pbar>i{overflow:hidden}
.pbar>b{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:1px;background:var(--ink)}
.endl{display:grid;gap:2px;margin-top:2px}
.endr{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:8px;font-size:12px;font-weight:650;color:var(--ink2)}
.endr .c{margin-left:auto;min-width:24px;height:20px;padding:0 7px;border-radius:6px;background:#eef0f3;font-size:12px;font-weight:700;color:var(--ink2);display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* 发送 */
.dock{position:fixed;top:66px;right:18px;bottom:18px;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:8px;pointer-events:none}
/* 留言框外面这一层：留言框不在框里滚，字多了一直往上长；长到面包屑下面还放不下时这一层滚（滚动条贴在窗口右边，框外），留言框始终整段可见 */
.mwrap{display:flex;flex-direction:column;min-height:0;flex:0 1 auto;margin:-12px -18px -4px -40px;padding:12px 18px 4px 40px;overflow:visible;overscroll-behavior:contain;scrollbar-color:var(--ink4) transparent}
/* 放不下时才滚（平时 visible，框底的投影不被裁）；滚动条占的宽度从右内边距里扣掉，框不横跳 */
.mwrap.over{pointer-events:auto;overflow-y:auto;padding-right:max(0px,calc(18px - var(--sbw,0px)))}
.mwrap[hidden]{display:none}
.dock>*{pointer-events:none}
.dtop{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dtop:empty{display:none}
.dtop>*,.memo,.dsend>*,.mbtn{pointer-events:auto}
.dtop>*,.memo,.dsend>*{animation:rise .24s var(--ease) both}
.sendbar{display:flex;align-items:center;gap:6px;padding:5px;border-radius:14px}
.send{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;height:var(--h-lg);padding:0 16px 0 14px;border:0;border-radius:10px;background:linear-gradient(#3b6ee0,var(--blue));color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(16,18,22,.2),0 6px 14px -6px rgba(47,98,214,.6);transition:background .14s,box-shadow .2s,transform .12s var(--ease)}
.send:hover{background:linear-gradient(var(--blue),var(--blue2))}
.send:active{transform:translateY(1px)}
.send[disabled]{background:#e3e6eb;color:#5a6069;box-shadow:none;cursor:not-allowed}
.send .i{width:16px;height:16px;stroke-width:2}
.clr{display:grid;place-items:center;width:var(--h-md);height:var(--h-md);border:0;border-radius:9px;background:transparent;color:var(--ink2);cursor:pointer}
.clr:hover{background:var(--hover);color:var(--ink)}
.toast{max-width:440px;padding:11px 14px;border-radius:12px;background:#fff;box-shadow:0 10px 30px -10px rgba(16,18,22,.3),0 0 0 1px var(--line);font-size:13px;line-height:1.5;color:var(--ink2)}
.toast .th2{display:flex;align-items:center;gap:7px;font-weight:650;color:var(--ink)}
.toast.err{box-shadow:0 10px 30px -10px rgba(191,44,44,.35),0 0 0 1px var(--rline)}
.toast.err .th2{color:var(--red)}
.toast.err pre{margin:8px 0 0;padding:8px 10px;max-height:150px;overflow:auto;border-radius:8px;background:var(--rsoft);color:#7d1d1d;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all}
.toast .ghost{color:var(--blue)}
.toast .ghost:first-of-type{margin-left:auto}
.toast .why{margin-top:4px}
a.ghost{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600}
/* 4080 远程网关给顶层页面右下角注入的「退出登录」浮层正好盖住发送按钮；退出登录在 DSH 设置里 */
#dsh-plugin-remote-logout{display:none!important}
/* 待发送列表、留言 */
.dbar{display:flex;align-items:center;gap:8px}
.pop{width:min(380px,calc(100vw - 36px));border-radius:14px;background:#fff;box-shadow:0 10px 30px -10px rgba(16,18,22,.35),0 0 0 1px var(--line)}
.qlist{margin:0;padding:5px;list-style:none;max-height:calc(var(--room,40vh) - 10px);overflow:auto;overscroll-behavior:contain}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:9px;transition:background .14s}
.qrow:hover{background:var(--hover)}
.qrow:hover .tk{background:#e3e6ec}
.qrow:hover .tk.go{color:var(--blue2)}
.qgo{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:baseline;min-width:0;padding:8px 4px 8px 9px;border:0;border-radius:9px;background:transparent;font:inherit;text-align:left;color:var(--ink);cursor:pointer}
.qk{font-size:11px;font-weight:700;color:var(--ink3)}
.qm{display:grid;min-width:0}
.qt,.qv{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qt{font-size:13px;font-weight:650;line-height:1.4}
.qv{font-size:12px;line-height:1.45;color:var(--ink3)}
.qgo:hover .qt{color:var(--blue)}
.qrow.cur{background:var(--bsoft)}
.qgo:focus-visible{outline-offset:-2px}
.qrow.memo-row .qt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:500}
.qdel{display:grid;place-items:center;width:var(--h-sm);height:var(--h-sm);margin-right:4px;border:0;border-radius:8px;background:transparent;color:var(--ink3);cursor:pointer;transition:background .14s,color .14s}
.qdel:hover{background:var(--rsoft);color:var(--red)}
/* 留言框、留言按钮、发送条：毛玻璃（半透明白 + 背景模糊 6px），不描边，靠两层柔和投影和顶边高光浮起来；不支持 backdrop-filter 时换成不透明浅色底。
   对比度不靠玻璃的透明度扛：有字的留言框白 50%（背后最暗时正文仍 ≥5.5:1，背后的卡片和文字行透得出来），框里的短标签自带不透明底；
   空框（只有占位字）、留言按钮和发送条（灰字、图标）用白 72%，背后是墨色块时 ink2 仍 ≥4.5:1 */
.memo,.mbtn,.sendbar{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(6px) saturate(1.25);backdrop-filter:blur(6px) saturate(1.25);box-shadow:0 18px 44px -18px rgba(16,18,22,.34),0 2px 8px -3px rgba(16,18,22,.1),inset 0 1px 0 rgba(255,255,255,.85)}
.memo{padding:4px;transition:background .18s,box-shadow .18s}
.memo{background:rgba(255,255,255,.5)}
.memo:has(.mi.empty){background:rgba(255,255,255,.72)}
.memo:focus-within{background:rgba(255,255,255,.58);box-shadow:0 22px 52px -18px rgba(16,18,22,.4),0 2px 8px -3px rgba(16,18,22,.12),inset 0 1px 0 rgba(255,255,255,.9)}
/* 留言输入区：可编辑的一段文字，会话 ID / 路径 / 提交号就地显示成短标签（标签整体是一个字符，退格一次删掉）；原文存在 data-raw 里 */
.mi{display:block;width:100%;min-height:42px;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;outline:none;caret-color:var(--blue);scrollbar-color:var(--ink4) transparent;cursor:text}
.mi:focus-visible{outline:0}
/* 占位字用 ink2：毛玻璃底透出背后的卡片时，ink3 最差只有 4:1 */
.mi.empty::before{content:attr(data-ph);color:var(--ink2);pointer-events:none}
/* 短标签用不透明底：蓝字 / 灰字的对比度和玻璃背后是什么无关 */
.mi .tk{margin:0 1px;background:#eef0f4;user-select:all;-webkit-user-select:all}
.mi .tk:hover{background:#e3e6ec}
.mi .tk.go,.mi .tk.go:hover{color:var(--blue2)}
.mi .tk.go:hover{background:#e2eafb}
/* 留言图片：粘贴 / 拖进来的图片在留言框最上面一排，64 见方，放不下就换行（框里不滚，留言框照样只往上长）；删除键在右上角，悬停 / 聚焦时出现，触屏常显 */
.mims{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.mims[hidden]{display:none}
.mim{position:relative;flex:none;width:64px;height:64px;animation:mim-in .24s var(--ease) both}
.mimg{position:relative;display:block;width:100%;height:100%;padding:0;border:0;border-radius:10px;overflow:hidden;background:rgba(36,44,60,.075);cursor:zoom-in}
.mimg img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s,filter .2s}
.mimg::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(16,18,22,.1);pointer-events:none}
.mimg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mim.up .mimg{cursor:progress}
.mim.up .mimg img{opacity:.45}
.mim.bad .mimg{cursor:pointer}
.mim.bad .mimg img{opacity:.35;filter:grayscale(1)}
/* 取不回来：不露浏览器的裂图图标 */
.mim.gone .mimg img{visibility:hidden}
.mim.bad .mimg::after{box-shadow:inset 0 0 0 1.5px var(--red)}
.mbadge .spin{width:16px;height:16px}
.mbadge{position:absolute;inset:0;margin:auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--red);box-shadow:0 1px 3px rgba(16,18,22,.2)}
.mbadge .i{width:15px;height:15px;stroke-width:1.8}
.mdel{position:absolute;top:4px;right:4px;z-index:1;display:grid;place-items:center;width:18px;height:18px;padding:0;border:0;border-radius:50%;background:rgba(21,23,27,.66);box-shadow:0 0 0 1px rgba(255,255,255,.7);color:#fff;cursor:pointer;opacity:0;transition:opacity .16s,background .14s}
.mdel::before{content:"";position:absolute;inset:-5px}
.mdel .i{width:10px;height:10px;stroke-width:2.2}
.mdel:hover{background:var(--ink)}
.mdel:focus-visible{outline:2px solid var(--blue);outline-offset:1px;opacity:1}
.mim:hover .mdel,.mim:focus-within .mdel{opacity:1}
@media (pointer:coarse){.mdel{opacity:1}}
@keyframes mim-in{from{opacity:.4;transform:scale(.94)}}
/* 图片放不进来时的一句话（6 秒后自己收起） */
.mnote{display:flex;align-items:flex-start;gap:6px;margin:8px 12px 0;padding:4px 8px;border-radius:6px;background:var(--asoft);color:var(--amber);font-size:12px;font-weight:650;line-height:1.45;interpolate-size:allow-keywords;overflow:hidden;transition:height .2s var(--ease),opacity .2s,margin .2s var(--ease),padding .2s var(--ease)}
.mnote.out{height:0;opacity:0;margin-top:0;padding-top:0;padding-bottom:0}
.mnote:empty{display:none}
.mnote.err{background:var(--rsoft);color:var(--red)}
.mnote .i{width:13px;height:13px;margin-top:1px}
/* 拖着文件进窗口：留言框（没打开时是留言按钮）描一圈浅蓝；拖到它上面变成 DSH 蓝，底色变浅蓝 */
.dock.fdrag .memo,.dock.fdrag .mwrap[hidden]~.dbar .mbtn{outline:1.5px solid var(--bline);outline-offset:-1.5px}
/* 和上面的浅蓝边同一个前缀，优先级更高才压得住 */
.dock.fdrag .memo.fover,.dock.fdrag .mwrap[hidden]~.dbar .mbtn.fover{outline:2px solid var(--blue);outline-offset:-2px;background:rgba(237,242,253,.92)}
.mbtn{position:relative;display:grid;place-items:center;width:50px;height:50px;border:0;border-radius:14px;color:var(--ink2);cursor:pointer;transition:color .14s,background .14s}
.mbtn:hover{color:var(--ink);background:rgba(255,255,255,.86)}
.mbtn[aria-expanded="true"]{color:var(--blue2)}
.sendbar:has(.blockmsg){background:rgba(255,255,255,.84)}
/* 放在所有 .memo / .mbtn / .sendbar 规则后面：同优先级时后写的生效 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.memo,.memo:has(.mi.empty),.mbtn,.sendbar,.sendbar:has(.blockmsg){background:#fbfbfc}.memo:focus-within,.memo:has(.mi.empty):focus-within,.mbtn:hover{background:#fff}}
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){.memo,.memo:has(.mi.empty),.mbtn,.sendbar,.sendbar:has(.blockmsg){background:#fbfbfc;-webkit-backdrop-filter:none;backdrop-filter:none}.memo:focus-within,.memo:has(.mi.empty):focus-within,.mbtn:hover{background:#fff}}
@media (forced-colors:active){.send{outline:1px solid ButtonText}.memo,.mbtn,.sendbar{outline:1px solid CanvasText}.mbtn:focus-visible,.memo:focus-within{outline:2px solid Highlight;outline-offset:2px}}
.mbtn .i{width:19px;height:19px}
.mbtn.has[aria-expanded="false"]::after{content:"";position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff}
.tog{display:inline-flex;align-items:center;gap:5px;height:var(--h-md);padding:0 8px 0 11px;border:0;border-radius:9px;background:transparent;color:var(--ink2);font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.tog:hover,.tog[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
.tog .dn{display:inline-block;color:var(--ink)}
.tog .dn.bump{animation:bump .3s var(--ease)}
.tog .i{width:13px;height:13px;transition:transform .2s var(--ease)}
.tog[aria-expanded="true"] .i{transform:rotate(180deg)}
/* 琥珀提示自带不透明浅琥珀底：对比度和发送条背后是什么无关 */
.blockmsg{font-size:12px;color:var(--amber);font-weight:650;padding:3px 8px;max-width:240px;border-radius:7px;background:var(--asoft)}

/* 灯箱 */
.lbx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(12,13,16,.78);animation:fade .16s ease both}
.lbx figure{margin:0;max-width:92vw;max-height:90vh;display:grid;gap:8px;justify-items:center;animation:zoom .22s var(--ease) both}
.lbx img{max-width:92vw;max-height:82vh;border-radius:8px;background:#fff}
.lbx figcaption{color:#fff;font-size:13px;font-weight:650}
.lbx button{position:fixed;top:14px;right:14px;width:var(--h-md);height:var(--h-md);border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}

/* 动效 */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes zoom{from{opacity:0;transform:scale(.96)}}
@keyframes grow-x{from{transform:scaleX(.35);opacity:.2}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(220%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%{box-shadow:0 0 0 1px var(--blue),0 0 0 0 rgba(47,98,214,.45)}100%{box-shadow:0 0 0 1px var(--blue),0 0 0 10px rgba(47,98,214,0)}}
.right.enter .dh,.right.enter .bodyx>*,.right.enter .after>*{animation:rise .36s var(--ease) both;animation-delay:calc(var(--d,0) * 40ms)}
.right.enter .kpi{animation:rise .36s var(--ease) both;animation-delay:calc(60ms + var(--d,0) * 50ms)}
.right.enter .kpi .bars i,.right.enter .kpi .wl i,.right.enter .kpi .tr>i{animation:grow .7s var(--ease) both;animation-delay:.18s}
.sc.sel.flash{animation:flash .7s var(--ease)}
@media (prefers-reduced-motion: reduce){
 *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (max-width:1100px){
 .right{--rp:20px}
 .rbody{padding-top:18px}
 .cols{gap:10px}
 .cio{grid-template-columns:minmax(0,1fr)}
 .kpis{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
 .kpi .kv{font-size:22px}
 .fact{grid-template-columns:24px 52px minmax(0,1fr);gap:0 8px}
}

/* 盖章位：决定行右侧、详情标题右侧的锚点（不占位）；章比锚点大，压在旁边的字上，不接点击 */
.dr:has(.stp){position:relative}
/* 左栏很窄时（行宽不到 240）章缩小，落在行底下留出的一条里，不压标题和回执 */
.lscroll{container-type:inline-size}
@container (max-width: 270px){.dr:has(.stp){padding-bottom:20px}}
.sc.stamped.slim{padding-bottom:28px}
.stp{position:absolute;right:12px;top:50%;width:0;height:0}
.dh{position:relative}
.dstp{position:absolute;top:22px;right:4px;width:0;height:0}
.kpi .kw.hot{color:var(--amber)}
.rbody>.dh,.rbody>.bodyx,.rbody>.after{max-width:780px}
.rfoot>*{margin:0;max-width:780px}
.rfoot .acts{pointer-events:none}
.rfoot .btn{pointer-events:auto;box-shadow:var(--lift),var(--float)}
/* 右栏够宽（≥960）且正文后面那一块里有回执、修改意见框以外的东西（待办、选项、回复框、附件、工具调用）时分两栏：标题、出错框跨两栏；左边数字卡、正在执行、现状 / 下一步 / 起因
   （有待办、选项或回复框时还有附件），右边从数字卡那一行开始放正文后面那一块（选项卡竖排一列；没有待办、选项、回复框时附件在最上面，截图放大成预览）。
   只有回执或修改意见框时内容短，仍单栏（点「修改」不让整页换版）。两栏合起来最宽 1320，悬浮按钮跟着同宽（「放弃」贴右栏右边）。窄的时候仍是单栏、最宽 780 */
@container (min-width:960px){
 /* 给 JS 看的断点（placeAtt）：右栏 ≥ 960 时附件回到两栏的位置，和这里的两栏规则同一个断点 */
 .rbody{--twocol:1}
 .rbody:has(>.after>:not(.rcpt,.rev)){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"h h" "x x" "k a" "w a" "m a" "b a" "t a";grid-template-rows:auto auto auto auto auto auto minmax(max-content,1fr);column-gap:36px;align-content:start;align-items:start;padding-right:max(var(--rp),calc(100cqw - var(--rp) - 1320px))}
 /* 最后一行至少 max-content：右栏跨的行里只有 1fr 时，高度定死的网格不按右栏内容撑开，右栏溢出、底部留白不算进滚动高度，最后一条待办被按钮挡住 */
 .rbody:has(>.after>:not(.rcpt,.rev))>.bodyx,.rbody:has(>.after>:not(.rcpt,.rev)) .bB{display:contents}
 .rbody:has(>.after>:not(.rcpt,.rev))>.dh{grid-area:h;max-width:none}
 .rbody:has(>.after>:not(.rcpt,.rev)) .fault{grid-area:x}
 .rbody:has(>.after>:not(.rcpt,.rev)) .kpis{grid-area:k}
 /* 正在执行：左栏数字卡下面（没有时这一行高度为 0） */
 .rbody:has(>.after>:not(.rcpt,.rev)) .bB>.dw{grid-area:w}
 .rbody:has(>.after>:not(.rcpt,.rev)) .facts{grid-area:m}
 .rbody:has(>.after>:not(.rcpt,.rev)) .bB>.btw{grid-area:b}
 .rbody:has(>.after>:not(.rcpt,.rev))>.bodyx .att{grid-area:t}
 .rbody:has(>.after>:not(.rcpt,.rev))>.after{grid-area:a;max-width:none}
 .rbody:has(>.after>:not(.rcpt,.rev))>.after>:first-child{margin-top:0}
 .rbody:has(>.after>:not(.rcpt,.rev)) .opts{grid-template-columns:minmax(0,1fr)}
 /* 右栏的附件：截图放大成预览，固定两列（空格由后面的图补上），16:10 框、从顶上裁（同缩略图和视觉类大图），说明写在图下面。只有一张普通截图时占两列，
    仍是 16:10：框高 clamp(135, 详情区高 − 300（还有长条图时 − 420）, 280)，到上限后宽度跟着缩、靠左（详情区不太矮时，连同链接都在首屏里、不排到按钮那一行）。
    长条图（宽 > 高 × 2.2）占满一行、按原比例完整显示（最高 112，靠左）；链接另起一行排在最后 */
 .rbody>.after>.att{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:10px;align-items:start}
 .rbody>.after>.att:not(:has(.thumb:not(.strip)~.thumb:not(.strip))) .thumb{grid-column:1/-1}
 .rbody>.after>.att .thumb{width:100%;height:auto;display:flex;flex-direction:column;background:var(--panel);transition:border-color .16s}
 .rbody>.after>.att .thumb img{height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top;transition:none}
 .rbody>.after>.att:not(:has(.thumb:not(.strip)~.thumb:not(.strip))) .thumb:not(.strip){justify-self:start;width:min(100%,calc(clamp(135px,var(--dh,clamp(340px,56vh,620px)) - 300px - var(--sx,0px),280px) * 1.6))}
 .rbody>.after>.att:has(.thumb.strip){--sx:120px}
 .rbody>.after>.att .thumb:hover{border-color:var(--bline)}
 .rbody>.after>.att .thumb:hover img{transform:none}
 .rbody>.after>.att .thumb>span:not(.bd){position:static;padding:8px 12px;border-top:1px solid var(--line2);background:none;color:var(--ink2);font-size:12px;font-weight:500}
 .rbody>.after>.att .thumb.bad{display:flex}
 .rbody>.after>.att .thumb .bd{aspect-ratio:16/10;justify-content:center;background:var(--sunk)}
 .rbody>.after>.att .thumb.strip{grid-column:1/-1}
 .rbody>.after>.att .thumb.strip img{aspect-ratio:auto;max-height:112px;object-fit:contain;object-position:left top}
 .rbody>.after>.att .als{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
 .rbody>.after>.att .aw{max-width:100%}
 .right.enter .rbody:has(>.after>:not(.rcpt,.rev)) .bB>:not(.kpis),.right.enter .rbody:has(>.after>:not(.rcpt,.rev)) .bodyx>:not(.bB){animation:rise .36s var(--ease) both;animation-delay:40ms}
 .right:has(>.rbody>.after>:not(.rcpt,.rev)) .rfoot{padding-right:max(var(--rp),calc(100cqw - var(--rp) - 1320px))}
 .right:has(>.rbody>.after>:not(.rcpt,.rev)) .rfoot>*{max-width:none}
 /* 视觉类：大图跨两栏（不被压窄），右栏从数字卡那一行开始；有待办 / 选项时大图只在左栏，待办留在右栏顶上 */
 .rbody:has(>.after>:not(.rcpt,.rev)):has(.shots){grid-template-areas:"h h" "x x" "s s" "k a" "w a" "m a" "b a" "t a";grid-template-rows:auto auto auto auto auto auto auto minmax(max-content,1fr)}
 .rbody:has(>.after>:is(.todos,.opts)):has(.shots){grid-template-areas:"h h" "x x" "s a" "k a" "w a" "m a" "b a" "t a"}
 .rbody:has(>.after>:not(.rcpt,.rev)) .shots{grid-area:s}
}
/* 两栏（右栏 ≥ 960，同上）时，待办项下在跑、列在左栏「正在执行」里的那一个（.wl）：名字视觉上藏起来（读屏照读），只剩「图标 已运行 X」；
   能点开会话时它带下划线（同名字）。按 right 容器判断：.todos 自己是容器，没名字的 @container 在它里面看的是待办栏的宽度 */
@container right (min-width:960px){
 .rbody:has(>.after>:not(.rcpt,.rev))>.after .runs summary .run.wl>:is(.run-n,.sep){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  // @chain-begin（align.test.mjs 抽出这一段单独测）
  // 会话链：沿 from（上一个会话里被接续的那一轮）往前、沿 next 往后，最早的在前；数据里成环就停
  function chainOf(s, ofRound) {
    const up = [], down = [], seen = new Set([s]);
    for (let x = s.from && ofRound.get(s.from.id); x && !seen.has(x); x = x.from && ofRound.get(x.from.id)) { seen.add(x); up.unshift(x); }
    for (let x = s.next; x && !seen.has(x); x = x.next) { seen.add(x); down.push(x); }

  }
  // 链上标题都以同一个系列头开头（如「实时旁白第 N 轮：」，只差数字）时去掉它，窄栏里也认得出各项
  function chainLabels(titles) {
    const head = (t) => { const m = /^(.{1,24}?[：:])\s*(?=\S)/.exec(t); return m ? m[1] : null; };
    const hs = titles.map(head), norm = (h) => h && h.replace(/\d+/g, '#');
    if (!hs.every((h) => h && norm(h) === norm(hs[0]))) return titles;
    const out = titles.map((t, i) => t.slice(hs[i].length).trim());
    return new Set(out).size === out.length ? out : titles; // 去掉后有重名就不去
  }
  // 链长（> 6）时只留首尾和当前前后各一个，其余收起
  function chainShown(n, cur, all) {
    const ix = [...Array(n).keys()];
    return all || n <= 6 ? ix : ix.filter((i) => i === 0 || i === n - 1 || Math.abs(i - cur) <= 1);
  }
  // @chain-end
  function chainHtml(s) {
    const ch = chainOf(s, M.ofRound);

    const lab = chainLabels(ch.map((x) => x.title)), day = (iso) => { const d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm(iso); };

      const x = ch[i], t0 = x.first.started || x.first.updated, inner = '<span class="cn">' + (i + 1) + '</span><span class="ct">' + esc(lab[i]) + '</span><span class="cw">' + (t0 ? esc(day(t0)) : '') + '</span>';
      const cb = crefOf('r', x.last.id, '会话', x.sid || '', x.title, '会话：' + x.title);
      h += i === cur ? '<li aria-current="step">' + cb + '<div class="cr cur" title="' + esc(x.title) + '">' + inner + '</div></li>' : '<li>' + cb + '<button class="cr" data-act="sel" data-k="r:' + esc(x.last.id) + '" data-tab="sess" title="' + esc(x.title) + '">' + inner + '</button></li>';

    // 附件（两栏时的位置）：要选选项或写回复时留在正文末尾（左栏）；已发送、已处理的排在回执后面（右栏，先看到定了什么，再看截图）。单栏时 placeAtt 挪到数字卡后面
    const att = attHtml(d, false, 'd');

    if (d.status === 'done') {

      const parts = stamped ? [res, d.reply ? esc(d.reply) : ''] : [(d.auto === 'timeout' ? '已按推荐处理：' : '') + (d.choice ? '<b>' + esc(d.choice) + '</b>' : ''), res, d.reply ? esc(d.reply) : ''];

  const riskChip = (d) => (d.risk ? '<span class="chip">' + riskMark(d) + '风险' + esc(d.risk) + '</span>' : '');
  function dueChip(d) {
    if (d.status !== 'open' || !d.due) return d.status === 'sent' ? '<span class="chip">' + ic('send') + '已发送，等处理</span>' : d.status === 'done' ? '<span class="chip">' + ic('check') + '已处理</span>' : '';
    const t = left(d);
    return t < 0 ? '<span class="chip over">' + ic('clock') + '已超时 ' + short(-t) + '</span>' : '<span class="chip' + (t < 36e5 ? ' warn' : '') + '">' + ic('clock') + '剩 ' + short(t) + '</span>';

  // 标题上有章（选项名 / 已回复 + 时间）时回执不再重复这些，只留章上没有的回复原文；只选了选项的不出回执

  // ==== 顺便问（btw，api 16）====
  // 轮次详情里一节：问答列表（等答 空心圈 / 新答案 蓝点 / 已看过 实心灰点 / 没答就结束 短横）+ 「顺便问一句」。问题进发送队列，和决定一起发给 First Mate 转给会话

  // 会话小卡标题行 / 时间线里这一轮的气泡：有顺便问才出；有新回答时图标变蓝。小卡不带数字（蓝色数字是待决定数），时间线带灰色条数
  function btwMark(rounds, count) {

  // 只写文件、不发消息的即时操作（顺便问的「了解」、须知的「了解 / 恢复」）：k 是 S.acking / S.btwErr 里的键；成功返回 true
  async function postNow(k, answers) {
    if (S.acking[k]) return false;
    S.acking[k] = true; delete S.btwErr[k]; renderSide();
    let ok = false;
    try {
      const res = await fetch(base + '/answer', { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify({ answers }) });

  }

  // 决定栏里的须知：标题、正文、截图和链接，按钮只有「了解」（写 acked、不发消息）
  function noteCards() {
    const list = notesOf();

      if (!gs.length) continue;
      const n = gs.reduce((s, g) => s + g.count, 0), ns = gs.reduce((s, g) => s + (g.sub || 0), 0);
      // 耗时、体积两组只在有基线时出现，天数随基线来

      h += '<div class="ag ' + k + '"><div class="agh"' + (t ? ' title="' + esc(t) + '"' : '') + '>' + ic(icon) + title + '<span class="n">' + n + '</span>' + subTag(ns) + '</div><ul>' + gs.map((g) => {
        const key = r.id + '|' + k + '|' + g.key;
        const worst = k === 'slow' ? g.items.reduce((m, x) => Math.max(m, x.ms), 0) : k === 'big' ? g.items.reduce((m, x) => Math.max(m, x.chars), 0) : 0;
        const first = errHead((g.items[0].text || '').split('\n')[0]);
        const raw = k === 'error' || (k === 'timeout' && !TO_LABEL[g.label]);
        const label = k === 'error' ? errHead(g.label) : k === 'timeout' ? TO_LABEL[g.label] || first || g.label : (k === 'slow' ? '最长 ' + secs(worst) : '最多 ' + chars(worst)) + ' · P90 ' + (k === 'slow' ? secs(g.p90) : chars(g.p90));
        const occ = g.items.map((x) => {
          const v = k === 'slow' ? '<span class="ov"><b>' + secs(x.ms) + '</b> · ' + times(x.ratio) + '</span>'
            : k === 'big' ? '<span class="ov"><b>' + chars(x.chars) + '</b> · ' + times(x.ratio) + '</span>'
            : x.ms != null ? '<span class="ov">用时 ' + secs(x.ms) + '</span>' : '';
          return '<li>' + crefOf('r', r.id, '工具调用', [x.tool, mdhms(x.at), x.id, x.agent ? '子 agent ' + x.agent.sid : ''].filter(Boolean).join(' '), x.args || '', '工具调用：' + x.tool + ' ' + hms(x.at)) + '<div class="oh"><time datetime="' + esc(x.at) + '">' + esc(hms(x.at)) + '</time><span class="oa"' + (x.params ? ' title="' + esc(x.params) + '"' : '') + '>' + (x.agent ? '<span class="in ag" title="' + esc(x.agent.label || x.agent.sid) + '">' + ic('bot') + '<span>' + esc(x.agent.label || '子 agent') + '</span></span>' : '') + (x.inner ? '<span class="in">run_code 内</span>' : '') + esc(x.args || '（无参数）') + '</span>' + v + '</div>' + (x.text ? '<pre>' + esc(x.text) + '</pre>' : '') + runHtml(x, k, r.sid) + '</li>';
        }).join('') + (g.more ? '<li class="mo">另有 ' + g.more + ' 次未列出</li>' : '');
        const rq = toolsApi >= 3 ? [...new Set(g.items.map((x) => runOf(x, r.sid)).filter(Boolean))] : [];
        if (rq.length && anOpen.has(key)) runFetch(rq);
        return '<li><details data-an="' + esc(key) + '"' + (rq.length ? ' data-rq="' + esc(rq.join(' ')) + '"' : '') + (anOpen.has(key) ? ' open' : '') + '><summary><span class="tn">' + esc(g.tool) + '</span><span class="lb' + (raw ? ' raw' : '') + '" title="' + esc(label) + '">' + esc(label) + '</span>' + (g.worst ? ratioTag(g.worst) : '') + '<span class="ct">× <b>' + g.count + '</b>' + subTag(g.sub) + '</span>' + ic('chev', 'cv') + '</summary><ol class="occ">' + occ + '</ol></details></li>';
      }).join('') + '</ul></div>';
    }
    if (!h) h = '<div class="st">' + ic('check') + '没有异常</div>';
    if (!j.baseline) h += '<div class="st">' + ic('dots') + (j.baselineError ? '耗时、返回内容的 P90 没算出来：' + esc(j.baselineError) : '耗时、返回内容的 P90 还在统计，稍后重开详情再看') + '</div>';
    // 底部一行：派过子 agent 才有；点开带上子 agent 的调用，再点只看会话自己的
    if (toolsApi >= 2 && a.data.subagents > 0) {
      const s = a.sub, bad = withSub ? (j.agents || []).filter((x) => x.error) : [];
      h += '<div class="subr"><button class="fc' + (withSub ? ' on' : '') + '" data-act="ansub" data-id="' + esc(r.id) + '" aria-pressed="' + withSub + '"' + (subLoading ? ' aria-busy="true"' : '') + ' title="直接派出 ' + a.data.subagents + ' 个子 agent">' + ic('bot') + '含子 agent 的调用</button>' +
        (subLoading ? '<span class="st">' + ic('dots') + '读取中</span>' : '') +
        (s && s.state === 'err' ? '<span class="st err">' + ic('alert') + '没取到：' + esc(s.msg) + '</span>' : '') +
        (bad.length ? '<span class="st err">' + ic('alert') + bad.length + ' 个子 agent 读不到：' + esc(bad[0].label || bad[0].sid) + '：' + esc(bad[0].error) + '</span>' : '') + '</div>';
    }
    // 含子 agent 时总数、组数、次数胶囊口径一致：总数含子 agent，机器人数字 = 其中来自子 agent 的
    return '<section class="an' + (withSub ? ' ws' : '') + '">' + head(withSub ? j.calls + j.subCalls : j.calls).replace('<span class="ln">', withSub ? subTag(j.subCalls) + '<span class="ln">' : subLoading ? '<span class="c">· 正在加上子 agent 的调用</span><span class="ln">' : '<span class="ln">') + h + '</section>';
  }
  document.addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.an) { if (d.open) { anOpen.add(d.dataset.an); if (d.dataset.rq) runFetch(d.dataset.rq.split(' ')); } else anOpen.delete(d.dataset.an); } }, true);
  // 轮次操作：按钮悬浮在底部；回执和修改意见框留在正文末尾
  function roundActs(r) {
    const p = picks['r:' + r.id] || {}, a = p.action;
    const b = (act) => '<button class="btn ' + ACT_KIND[act] + (a === act ? ' on' : '') + '" data-act="ract" data-id="' + esc(r.id) + '" data-v="' + act + '" aria-pressed="' + (a === act) + '">' + ic(a === act ? 'check' : ACT_ICON[act]) + ACT[act] + '</button>';
    let foot = '', body = '';
    if (r.status === 'done') foot = b('accept') + b('revise') + '<span class="rgt">' + b('dropped') + '</span>';
    else if (r.status === 'doing' || r.status === 'waiting') foot = '<span class="rgt">' + b('paused') + b('dropped') + '</span>';
    else if (r.status === 'paused') foot = b('resume') + '<span class="rgt">' + b('dropped') + '</span>';
    if (r.ask && !a) body += '<div class="rcpt">' + ic('send') + '<span>已发送：<b>' + esc(ACT[r.ask] || r.ask) + '</b>' + (r.asknote ? ' · ' + esc(r.asknote) : '') + '<span class="tm">' + esc(when(r.asked)) + '</span></span></div>';
    if (r.status === 'done' && a === 'revise') body += '<div class="rev"><textarea data-in="rnote" data-id="' + esc(r.id) + '" placeholder="哪里要改" maxlength="2000" aria-label="修改意见">' + esc(p.note || '') + '</textarea>' + (!(p.note || '').trim() ? '<div class="hint">' + ic('pen') + '写了修改意见才会发出</div>' : '') + '</div>';
    return { body, foot: foot ? '<div class="acts">' + foot + '</div>' : '' };
  }
  // 右栏 = 正文（单独滚动）+ 底部操作栏（没有操作时不占地方）
  function rightHtml() {
    if (S.doc) return { body: docHtml(S.doc), foot: '' };
    const x = selInfo();
    if (x.d) return decDetail(x.d);
    if (x.r) return roundDetail(x.r);
    if (x.t) return todoDetail(x.t);
    if (x.g) return goalDetail(x.g);
    return { body: '<div class="lempty">' + ic('inbox') + '选一个会话或决定</div>', foot: '' };
  }

  // ==== 会话区：4 个状态列，每列里项目是大卡片、会话是小卡片 ====
  function sessCard(s, k) {
    const r = s.last, p = prog(r), x = selInfo(), sel = x.s === s;
    const run = k === 'doing' && busy(r.sid);
    // 小卡的预计只认轮次登记的（etaadj，没有就 eta）；待办估时合计不算
    const total = dur(r.etaadj || r.eta), over = total && p.el > total && k !== 'end';
    // 进度条：填充 = 已用 / max(已用, 预计)，刻度 = 预计；超出预计在进行中、阻塞里变琥珀，待验收里保持灰色
    const span = Math.max(p.el, total || 0) || 1;
    const fill = total ? p.el / span : k === 'done' || k === 'end' ? 1 : 0;
    let meta = '';
    if (k === 'blk') { const v = reasonView(r, s.col); meta += '<span class="rs ' + v.k + '" title="' + esc(v.tip || v.t) + '">' + ic(v.i) + '<span class="rt">' + v.t + '</span></span>'; }
    if (s.rounds.length > 1) meta += '<span class="rp" title="续发 ' + (s.rounds.length - 1) + ' 次">' + ic('repeat') + (s.rounds.length - 1) + '</span>';
    if (hasPickS(s)) meta += '<span class="pk" title="有已选待发送的">' + ic('check') + '</span>';
    const nWait = btwWaiting(s.rounds).length;
    if (nWait) meta += '<span class="bwn">' + nWait + ' 条没答</span>';
    if (k === 'doing' || k === 'blk') meta += ringHtml(r, p, ringWhole.has(r.id));
    const cx = k === 'doing' ? curItem(r) : null;
    if (cx) meta += curHtml(cx, r.sid);
    meta += '<span class="tm"' + (k === 'doing' || k === 'blk' ? tipAttr('已用 ' + elText(p) + (total ? ' / 预计 ' + short(total) : ' · 没登记预计'), [splitTip(p.el, p.main, Math.floor)], [k === 'blk' && p.el ? '阻塞期间不计时' : '', p.untimed ? UNTIMED : '', p.noBg ? NO_BG : ''], true) : '') + '>' + (k === 'blk' && p.el ? '<span class="ps">' + ic('pause') + '</span>' : '') + '<span class="tv">' + (k === 'doing' || k === 'blk' ? esc(elText(p)) + (total ? '<span class="tt"> / ' + short(total) + '</span>' : '') : esc(when(r.ended || r.updated))) + '</span></span>';
    const fin = k === 'done' || k === 'end';
    // 交了结果的：满条灰色，超出预计时在预计的位置画一道刻度
    const tickAt = total && p.el > total ? total / span : 0;
    // 没登记预计又没交结果的：只写已用，不画进度条（画了也表达不了进度）
    const bar = !total && !fin ? '' : '<span class="pbar' + (run ? ' run' : '') + (over && !fin ? ' hot' : '') + (k === 'blk' ? ' blk' : '') + '"><i style="width:' + (fill * 100).toFixed(1) + '%"></i>' + (tickAt ? '<b style="left:' + (tickAt * 100).toFixed(1) + '%" title="预计用时的位置"></b>' : '') + '</span>';
    return '<button class="sc' + (sel ? ' sel' : '') + (run ? ' run' : '') + (stampsNow()['r:' + r.id] ? ' stamped' : '') + '" data-act="sess" data-v="' + esc(s.key) + '" data-key="' + esc(s.key) + '" data-rid="' + esc(r.id) + '">' + (s.open.length ? '<span class="sc-b" title="待决定">' + s.open.length + '</span>' : '') + '<span class="sc-t"><span class="sc-tx">' + esc(s.title) + '</span>' + btwMark(s.rounds) + newDot(r.id) + '</span><span class="sc-m">' + meta + '</span>' + cardWork(r.sid) + bar + '</button>';
  }
  // 小卡第三行：正在执行的子 agent（机器人）和后台任务（终端），1 个写名字，2 个以上写「n 个…执行中…」；悬停列出全部
  function cardWork(sid) {
    const w = workOf(sid);
    if (!w) return '';
    const seg = (k) => {
      const list = w[WORK[k].key];
      if (!list.length) return '';
      const lines = workLines(k, list), head = workHead(k, list);
      return '<span class="wk ' + k + (list.length > 1 ? ' m' : '') + '" aria-hidden="true"' + tipAttr(list.length > 1 ? head : '', lines, [], false) + '>' + ic(WORK[k].icon) + '<span class="wt">' + (list.length === 1 ? workNameHtml(k, list[0]) : esc(head)) + '</span><span class="wn" aria-hidden="true">' + list.length + '</span></span>';
    };
    // 读屏和键盘：整张卡是按钮，悬停浮层到不了，把完整清单放进一段视觉隐藏的文字
    const all = ['sub', 'job'].filter((k) => w[WORK[k].key].length).map((k) => WORK[k].sr + '：' + workLines(k, w[WORK[k].key]).join('、')).join('。');
    return '<span class="sc-w">' + seg('sub') + seg('job') + '<span class="sr">' + esc(all) + '</span></span>';
  }
  function projGroup(k, g, i, n) {
    const name = esc(ptitle(g.pid)), cnt = '<span class="c">' + g.items.length + '</span>';
    // 「已完成」栏的项目条可以拖动 / Alt+↑↓ 排顺序（要有服务端才存得下，离线打开的文件不给拖）
    const mv = k === 'end' && live && serverApi >= 10;
    const head = mv
      ? '<h3 class="mv" tabindex="0" aria-label="' + name + '，' + g.items.length + ' 个会话，第 ' + (i + 1) + ' 个，共 ' + n + ' 个" aria-describedby="mv-help" aria-keyshortcuts="Alt+ArrowUp Alt+ArrowDown" title="' + name + '：拖动或按 Alt+↑ ↓ 调整顺序"><span class="grip" aria-hidden="true">' + ic('grip') + '</span><span class="pdot"></span><span class="pn">' + name + '</span><kbd class="kh" aria-hidden="true">Alt ↑↓</kbd>' + cnt + '</h3>'
      : '<h3><span class="pdot"></span>' + name + cnt + '</h3>';
    const open = '<section class="pcard" data-pid="' + esc(g.pid) + '" data-flip="' + k + '|' + esc(g.pid) + '" style="--pc:' + pcolor(g.pid) + '">';
    if (k === 'end') { const x = selInfo(), mine = g.items.find((s) => s === x.s); return open + head + (mine ? sessCard(mine, k) : '') + '</section>'; }
    return open + head + g.items.map((s) => sessCard(s, k)).join('') + '</section>';
  }
  function boardHtml() {
    const C = { doing: [], blk: [], done: [], end: [] };
    // Curio 的会话画在上面的 Curio 区，不进四个状态列（没取到 Curio 状态时照旧）
    const cs = curioSess();
    for (const s of M.sess) if (s !== cs) C[COLKEY[s.col.col]].push(s);
    C.doing.sort((a, b) => ms(b.last.updated) - ms(a.last.updated));
    C.blk = sortBlocked(C.blk.map((s) => ({ reason: s.col.reason, decisions: s.open, s })), Date.now()).map((c) => c.s);
    C.done.sort((a, b) => ms(b.last.ended || b.last.updated) - ms(a.last.ended || a.last.updated));
    C.end.sort((a, b) => ms(b.last.ended || b.last.updated) - ms(a.last.ended || a.last.updated));
    // 项目顺序跟「已完成」栏拖出来的 projOrder 走；没排过时：进行中 / 阻塞 / 待验收最急的组在前，已完成会话多的在前
    const grp = (k, gs) => orderGroups(gs, data.projOrder).map((g, i, a) => projGroup(k, g, i, a.length)).join('');
    const G = {
      doing: grp('doing', groupByProject(C.doing, (s) => s.proj)),
      blk: grp('blk', groupByProject(C.blk, (s) => s.proj)),
      done: grp('done', groupByProject(C.done, (s) => s.proj)),
      end: grp('end', groupByProject(C.end, (s) => s.proj).sort((a, b) => b.items.length - a.items.length)),
    };
    const head = (k, t, icon) => '<div class="colh">' + '<svg class="i g ' + k + '" viewBox="0 0 16 16" aria-hidden="true">' + P[icon] + '</svg>' + t + '<span class="c">' + C[k].length + '</span></div>';
    const col = (k, t, icon) => '<section class="col ' + k + '" aria-label="' + t + '">' + head(k, t, icon) + (G[k] || '<div class="cempty"></div>') + '</section>';
    return curioHtml(cs) + '<div class="cols">' + col('doing', '进行中', 'pulse') + col('blk', '阻塞', 'flag') + col('done', '待验收', 'check') + col('end', '已完成', 'inbox') + '</div>';
  }

  // ==== Curio：看板最上面一块（Goal、子 agent、模型来自 /alignment/curio；里程碑是它在这一页上交了结果的轮次；决定仍在「决定」页签）====
  const curioSess = () => (curio && M ? M.bySid.get(curio.sid) || null : null);
  const CIO_ST = { running: ['blue', '在跑'], paused: ['warn', '暂停'], blocked: ['warn', '阻塞'], complete: ['ink', '目标已完成'], stopped: ['ink', '已停'], idle: ['', '没有目标'], unloaded: ['', '没在跑'] };
  const cioTitle = (t) => String(t || '').replace(/^(?:Curio|personal Agent)\s*[：:]?\s*/, '');
  // 结果的第一句（到第一个句号或分号）
  const cioLead = (t) => { const m = /^[^。；]*[。；]?/.exec(String(t || '').trim()); return (m ? m[0] : '').replace(/[；]$/, ''); };
  const cioEvidence = (r) => { const ls = r.link || []; return ls.find((l) => /证据/.test(l.title || '') || /goal-evidence/.test(l.href)) || ls[0] || null; };
  function curioHtml(cs) {
    if (!curio) return curioErr ? '<section class="cio one" aria-label="Curio"><div><div class="cio-h"><span class="cio-n">Curio</span></div><div class="cio-p red">' + ic('alert') + '<span>' + esc(curioErr) + '</span></div></div></section>' : '';
    const c = curio, [tone, label] = CIO_ST[c.state] || ['', c.state];
    const chip = '<span class="chip' + (tone ? ' ' + tone : '') + '">' + (c.state === 'running' ? '<span class="dotp"></span>' : '') + esc(label) + '</span>';
    const name = cs ? '<button class="cio-n" data-act="sel" data-k="r:' + esc(cs.last.id) + '" data-tab="sess">Curio</button>' : '<span class="cio-n">Curio</span>';
    const g = c.goal;
    const goalLine = g && g.objective ? (g.objective.split(/\r?\n/).find((l) => l.trim()) || '').trim() : '';
    const meta = [];
    if (g && g.round != null && g.max != null) meta.push('第 <b>' + g.round + '</b> / ' + g.max + ' 轮');
    if (g && g.since) meta.push('开始 ' + esc(when(new Date(g.since).toISOString())));
    if (c.models && c.models.main) meta.push([ic('server') + '模型 ' + esc(c.models.main.model), '最近一次请求 ' + when(c.models.main.at)]);
    const p = c.pause, pre = { paused: '暂停', blocked: '阻塞', stopped: '已停' }[c.state];
    const pause = pre && p && (p.reason || p.until) ? '<div class="cio-p">' + ic(c.state === 'paused' ? 'pause' : 'flag') + '<span>' + esc(pre + (p.reason ? '：' + p.reason : '')) + (p.until ? ' · 预计 ' + esc(when(new Date(p.until).toISOString())) + ' 继续' : '') + '</span></div>' : '';
    // 子 agent：在跑几个 / 上限，一格一个
    const n = c.subagents, cap = c.cap;
    const kids = (c.models && c.models.children) || [];
    const cool = new Map();
    for (const x of c.cooling || []) { const k = hm(new Date(x.until).toISOString()); cool.set(k, [...(cool.get(k) || []), x.model]); }
    const slots = cap > 0 ? '<div class="cio-s"><div class="cio-sn"><b>' + n + '</b>/ ' + cap + ' 个子 agent 在跑</div><div class="cio-bar" aria-hidden="true">' + Array.from({ length: cap }, (_, i) => '<i' + (i < n ? ' class="on"' : '') + '></i>').join('') + '</div>' +
      (kids.length || cool.size ? '<div class="cio-m">' + (kids.length ? '<span title="' + esc('近 10 分钟的请求：' + kids.map((x) => x.model + ' ' + x.n + ' 次').join('、')) + '">' + ic('bot') + '近 10 分钟子 agent 用 ' + esc(kids.map((x) => x.model).join('、')) + '</span>' : '') + [...cool].map(([t, ms]) => '<span>' + ic('clock') + esc(ms.join('、')) + ' 冷却到 ' + t + '</span>').join('') + '</div>' : '') + '</div>' : '';
    const open = cs ? sortDecisions(cs.open, Date.now()) : [];
    const dec = open.length ? '<button class="cio-d" data-act="cio-dec" data-k="d:' + esc(open[0].id) + '">' + ic('flag') + open.length + ' 件待你决定</button>' : '';
    const left = '<div class="cio-l"><div class="cio-h">' + name + chip + (c.private ? '<span class="chip">私密</span>' : '') + openChip(c.sid) + '</div>' + (goalLine ? '<div class="cio-g" title="' + esc(goalLine) + '">' + esc(goalLine) + '</div>' : '') + (meta.length ? '<div class="cio-m">' + meta.map((m) => (Array.isArray(m) ? '<span title="' + esc(m[1]) + '">' + m[0] + '</span>' : '<span>' + m + '</span>')).join('') + '</div>' : '') + pause + slots + dec + '</div>';
    // 最近完成：这一页上它交了结果的轮次（待验收、已完成），新的在上，最多 4 个
    const done = cs ? cs.rounds.filter((r) => r.status === 'done' || r.status === 'accepted').sort((a, b) => ms(b.ended || b.updated) - ms(a.ended || a.updated)).slice(0, 4) : [];
    const right = done.length ? '<div class="cio-r"><h4>最近完成</h4><ol class="cio-ms">' + done.map((r) => {
      const ev = cioEvidence(r);
      return '<li><span class="cio-w">' + esc(when(r.ended || r.updated)) + '</span><button class="cio-t" data-act="sel" data-k="r:' + esc(r.id) + '" data-tab="sess"><span class="cio-tt">' + esc(cioTitle(r.title)) + (r.status === 'done' ? '<span class="cio-ok">待验收</span>' : '') + '</span>' + (r.result ? '<span class="cio-rs">' + esc(cioLead(r.result)) + '</span>' : '') + '</button>' + (ev ? '<span class="cio-e">' + linkHtml({ ...ev, title: '证据' }) + '</span>' : '<span></span>') + '</li>';
    }).join('') + '</ol></div>' : '';
    return '<section class="cio' + (right ? '' : ' one') + '" aria-label="Curio">' + left + right + '</section>';
  }

  // ==== 发送 ====
  // @queue-begin（align.test.mjs 抽出这一段单独测）
  /** 给 First Mate 的留言草稿：picks['m:'] = {text, images?:[本机路径]}（images 是已经传到服务端的图片），和已选内容存在同一个键里，发送成功后清掉。 */

  const saveSplit = () => { if (SPL.h === null && SPL.w === null && SPL.d === null) { try { localStorage.removeItem(splitKey); } catch (e) { /* 存不了就只在本页有效 */ } } else save(splitKey, SPL); };
  for (const [el, kind] of [[hsplit, 'h'], [vsplit, 'w']]) {
    let drag = null, raf = 0, last = 0;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, at: kind === 'h' ? e.clientY : e.clientX, from: kind === 'h' ? curH() : curLW() };
      el.classList.add('on'); app.classList.add('drag', kind === 'h' ? 'drag-h' : 'drag-w');
    });
    el.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      last = drag.from + (kind === 'h' ? e.clientY : e.clientX) - drag.at;
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (drag) { setSplit(kind, last); if (kind === 'w') syncThumbs(); } });
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag = null; cancelAnimationFrame(raf); raf = 0;
      el.classList.remove('on'); app.classList.remove('drag', 'drag-h', 'drag-w');
      saveSplit(); syncThumbs();
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
    el.addEventListener('dblclick', () => { SPL[kind === 'h' ? hKey() : 'w'] = null; applySplit(); saveSplit(); requestAnimationFrame(() => { splitAria(); syncThumbs(); }); });
    el.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 64 : 16, keys = kind === 'h' ? { ArrowUp: -step, ArrowDown: step } : { ArrowLeft: -step, ArrowRight: step };
      const cur = kind === 'h' ? curH() : curLW(), [a, b] = kind === 'h' ? hRange(hTotal()) : wRange(detailEl.clientWidth);
      let to;
      if (keys[e.key]) to = cur + keys[e.key]; else if (e.key === 'Home') to = a; else if (e.key === 'End') to = b; else return;
      e.preventDefault();
      // 和拖动一样即时到位（按住方向键连发时不追高度过渡）
      app.classList.add('drag'); clearTimeout(kbdT); kbdT = setTimeout(() => app.classList.remove('drag'), 120);
      setSplit(kind, to); saveSplit(); syncThumbs();
    });
  }
  // ---- 「已完成」栏项目条排序：拖动（鼠标按住项目条、触屏按住左侧把手）或 Alt+↑↓；放下时存一次（POST /order） ----
  // 拖动中不改 DOM 顺序：原卡变成虚影并平移到落点，经过的卡用 transform 让开，跟手的是一份 position:fixed 的副本。
  // 放下后按新顺序重画会话区和决定列表，所有 [data-flip] 元素从旧位置滑到新位置（其他栏的项目也跟着动）。
  const FLIP_MS = 300, EDGE = 48;
  const flipRects = () => new Map([...document.querySelectorAll('[data-flip]')].map((el) => [el.dataset.flip, el.getBoundingClientRect()]));
  // 减少动态效果：不位移，移动过的项目淡入（颜色 / 透明度变化保留，看得出哪些动了）
  function flipFrom(before) {
    for (const el of document.querySelectorAll('[data-flip]')) {
      const a = before.get(el.dataset.flip);
      if (!a) continue;
      const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      if (RM.matches) { el.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: FLIP_MS, easing: 'ease-out' }); continue; }
      el.animate([{ translate: dx + 'px ' + dy + 'px' }, { translate: '0px 0px' }], { duration: FLIP_MS, easing: 'cubic-bezier(.22,1,.36,1)' });
    }
  }
  const endCards = () => [...boardEl.querySelectorAll('.col.end > .pcard[data-pid]')];
  const shownOrder = () => endCards().map((c) => c.dataset.pid);
  function redraw() { if (pdDirty) { pdDirty = false; render(); } else renderSide(); }
  /** ids：「已完成」栏的新顺序；old：改之前的；from：拖动副本最后的位置（被拖的卡从那里滑进落点）；delay：多久后保存。 */
  function applyOrder(ids, old, from, delay) {
    const before = flipRects();
    if (from) before.set(from.key, from.rect);
    const changed = ids.join('\n') !== old.join('\n');
    if (changed) {
      if (!ordPending) ordBase = data.projOrder;
      ordPending = true;
      data.projOrder = mergeOrder(ids, data.projOrder);
      ordErr = '';
    }
    redraw();
    flipFrom(before);
    if (!changed) return false;
    clearTimeout(ordTimer);
    ordTimer = setTimeout(saveOrder, delay);
    dockRender();
    return true;
  }
  async function saveOrder() {
    ordTimer = 0;
    const order = data.projOrder || [];
    try {
      const r = await fetch(base + '/order', { method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' }, body: JSON.stringify({ order }) });
      let j = null;
      try { j = await r.json(); } catch (e) { /* 不是 JSON：按状态码报 */ }
      if (!r.ok || !j || j.ok !== true) throw new Error((j && j.message) || 'HTTP ' + r.status);
      // 等保存期间又排了一次：留着本地的，下一次保存会带上
      if (!ordTimer) { data = j.data; if (j.data.live !== undefined) liveMap = j.data.live; if (j.data.work !== undefined) workMap = j.data.work; ordPending = false; ordBase = undefined; }
    } catch (e) {
      clearTimeout(ordTimer); ordTimer = 0;
      const before = flipRects();
      if (ordBase === undefined) delete data.projOrder; else data.projOrder = ordBase;
      ordPending = false; ordBase = undefined;
      ordErr = e.message || String(e);
      if (!pd) { redraw(); flipFrom(before); } else pdDirty = true;
    } finally { dockRender(); }
  }
  function startDrag(h, y) {
    const card = h.closest('.pcard'), cards = endCards(), a = cards.indexOf(card);
    if (a < 0 || cards.length < 2) return null;
    const old = shownOrder();
    const br = boardEl.getBoundingClientRect(), st = boardEl.scrollTop;
    // 各卡在会话区内容坐标里的位置（会话区滚动时不变）
    const box = cards.map((c) => { const r = c.getBoundingClientRect(); return { top: r.top - br.top + st, h: r.height }; });
    const gap = parseFloat(getComputedStyle(card).marginBottom) || 0;
    const r0 = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.add('pdrag');
    for (const k of ['data-flip', 'data-pid']) ghost.removeAttribute(k);
    ghost.setAttribute('aria-hidden', 'true'); ghost.inert = true;
    for (const x of ghost.querySelectorAll('[tabindex],[id]')) { x.removeAttribute('tabindex'); x.removeAttribute('id'); }
    Object.assign(ghost.style, { left: r0.left + 'px', top: r0.top + 'px', width: r0.width + 'px' });
    card.after(ghost);
    if (!RM.matches) ghost.animate([{ scale: '1' }, { scale: '1.02' }], { duration: 160, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    for (const c of cards) c.classList.add('shift');
    card.classList.add('ph');
    app.classList.add('pdragging');
    flashMsg('正在移动 ' + ptitle(card.dataset.pid) + '，Esc 取消');
    return { id: 0, card, cards, a, b: a, box, gap, ghost, y0: y, y, st0: st, raf: 0, old };
  }
  function dragLayout(d) {
    const st = boardEl.scrollTop, dy = d.y - d.y0;
    d.ghost.style.translate = '0px ' + dy + 'px';
    // 副本的中线越过哪张卡的中线，就放到哪
    const mid = d.box[d.a].top + (st - d.st0) + dy + d.box[d.a].h / 2;
    let b = 0;
    d.box.forEach((x, i) => { if (i !== d.a && x.top + x.h / 2 < mid) b++; });
    d.b = b;
    const step = d.box[d.a].h + d.gap;
    let ph = 0;
    d.cards.forEach((c, i) => {
      if (i === d.a) return;
      let t = 0;
      if (d.a < b && i > d.a && i <= b) { t = -step; ph += d.box[i].h + d.gap; }
      if (b < d.a && i >= b && i < d.a) { t = step; ph -= d.box[i].h + d.gap; }
      c.style.transform = t ? 'translateY(' + t + 'px)' : '';
    });
    d.card.style.transform = ph ? 'translateY(' + ph + 'px)' : '';
  }
  // 指针靠近会话区上下边时自动滚
  function dragTick() {
    const d = pd;
    if (!d) return;
    d.raf = 0;
    const br = boardEl.getBoundingClientRect();
    const v = d.y < br.top + EDGE ? d.y - (br.top + EDGE) : d.y > br.bottom - EDGE ? d.y - (br.bottom - EDGE) : 0;
    if (!v) return;
    const was = boardEl.scrollTop;
    boardEl.scrollTop += Math.sign(v) * Math.min(18, Math.ceil(Math.abs(v) / 3));
    if (boardEl.scrollTop !== was) dragLayout(d);
    d.raf = requestAnimationFrame(dragTick);
  }
  function endDrag(cancel) {
    const d = pd;
    if (!d) return;
    pd = null;
    cancelAnimationFrame(d.raf);
    app.classList.remove('pdragging');
    const ids = d.old.slice();
    if (!cancel) { const [x] = ids.splice(d.a, 1); ids.splice(d.b, 0, x); }
    const rect = d.ghost.getBoundingClientRect();
    d.ghost.remove();
    const pid = d.card.dataset.pid;
    const moved = applyOrder(ids, d.old, { key: 'end|' + pid, rect }, 0);
    if (moved) flashMsg(ptitle(pid) + ' 移到第 ' + (d.b + 1) + ' 个');
    else if (cancel) flashMsg('已取消移动');
  }
  let pdown = null;
  boardEl.addEventListener('pointerdown', (e) => {
    const h = e.target.closest && e.target.closest('.col.end h3.mv');
    if (!h || pd || e.button !== 0) return;
    // 触屏只从把手开始拖，项目条其余地方照常滚动
    if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
    pdown = { id: e.pointerId, h, x: e.clientX, y: e.clientY };
    h.setPointerCapture(e.pointerId);
  });
  boardEl.addEventListener('pointermove', (e) => {
    if (pd && e.pointerId === pd.id) {
      pd.y = e.clientY;
      dragLayout(pd);
      if (!pd.raf) pd.raf = requestAnimationFrame(dragTick);
      return;
    }
    if (!pdown || e.pointerId !== pdown.id || Math.hypot(e.clientX - pdown.x, e.clientY - pdown.y) < 4) return;
    pd = startDrag(pdown.h, pdown.y);
    if (pd) { pd.id = e.pointerId; pd.y = e.clientY; dragLayout(pd); pd.raf = requestAnimationFrame(dragTick); }
    pdown = null;
  });
  const upDrag = (cancel) => (e) => {
    if (pdown && e.pointerId === pdown.id) pdown = null;
    if (pd && e.pointerId === pd.id) endDrag(cancel);
  };
  boardEl.addEventListener('pointerup', upDrag(false));
  boardEl.addEventListener('pointercancel', upDrag(true));
  boardEl.addEventListener('lostpointercapture', upDrag(false));
  addEventListener('keydown', (e) => { if (pd && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endDrag(true); } }, true);
  boardEl.addEventListener('keydown', (e) => {
    const h = e.target.closest && e.target.closest('.col.end h3.mv');
    if (!h || pd || !e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const old = shownOrder(), pid = h.closest('.pcard').dataset.pid, i = old.indexOf(pid), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= old.length) return flashMsg(ptitle(pid) + (j < 0 ? ' 已经在最前' : ' 已经在最后'));
    const ids = old.slice(); ids.splice(i, 1); ids.splice(j, 0, pid);
    applyOrder(ids, old, null, 600); // 连按时合成一次保存
    const again = boardEl.querySelector('.col.end > .pcard[data-pid="' + CSS.escape(pid) + '"] h3.mv');
    if (again) again.focus();
    flashMsg(ptitle(pid) + ' 移到第 ' + (j + 1) + ' 个');
  });
  // 窗口变了：按新尺寸重新夹到上下限里（存下来的值不动）
  addEventListener('resize', applySplit);
  // 存过的位置首屏直接到位，不播高度过渡
  app.classList.add('drag');
  applySplit();
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('drag')));
  prunePicks();
  S.enter = 'init';
  render();
  splitAria();
  if (!/^[dr]=/.test(h0)) { const ls0 = leftEl.querySelector('.lscroll'); if (ls0 && v0.scroll.left !== undefined) ls0.scrollTop = v0.scroll.left; if (v0.scroll.right !== undefined) rightEl.scrollTop = v0.scroll.right; if (v0.scroll.board !== undefined) boardEl.scrollTop = v0.scroll.board; }
  leftEl.addEventListener('scroll', () => saveView(false), true);
  rbodyEl.addEventListener('scroll', () => saveView(false));
  // 悬浮按钮行多高，正文底部就留多少，滚到底时最后一行不被挡
  new ResizeObserver(() => rightEl.style.setProperty('--fh', rfootEl.offsetHeight + 'px')).observe(rfootEl);
  // 右栏宽度跨过 960（拖分隔条、窗口变化）时附件换位置
  new ResizeObserver(() => placeAtt()).observe(rightEl);
  boardEl.addEventListener('scroll', () => saveView(false));
  fmFetch();
  if (S.sel) markSeen(S.sel.slice(2));
})();
</script>
</body>
