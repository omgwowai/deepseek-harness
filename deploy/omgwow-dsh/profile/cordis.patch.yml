# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      tokenrouter:
        displayName: Token Router
        apiKeyEnv: TOKENROUTER_API_KEY
        api: openai-completions
        baseURL: https://tokenrouter.omgwow.tech/v1
        mergeUserMessages: true
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          thinkingFormat: deepseek
        models:
          - id: claude-fable-5
            name: Claude Fable 5
            contextWindow: 200000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              high: high
          - id: gpt-5.6-sol
            name: GPT 5.6 Sol
            contextWindow: 272000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
            compat:
              thinkingFormat: openai
          - id: kimi-k3
            name: Kimi K3
            contextWindow: 262144
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              high: high
          - id: claude-opus-5
            name: Claude Opus 5
            contextWindow: 200000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              high: high
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 128000
            maxTokens: 8192
            input: [text]
            reasoningEfforts:
              high: high
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 128000
            maxTokens: 65536
            input: [text]
            reasoningEfforts:
              high: high
              max: high
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 128000
            maxTokens: 65536
            input: [text]
            reasoningEfforts:
              high: high
              max: high
