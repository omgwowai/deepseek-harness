# Multimodal image input over an OpenAI-compatible gateway (tokenrouter), using
# rc8's pi-ai vision surface. Run it with an image on the prompt:
#
#   DSH_TOKENROUTER_API_KEY=... pnpm dsh --config \
#     examples/headless-agent/tokenrouter-vision.cordis.yml "what is in @./shot.png"
#
# The gateway multiplexes one OpenAI-compatible endpoint over many vendors, so
# pi-ai's URL-derived detection cannot recognize it and would address it as
# OpenAI itself. Every wire fact it would otherwise guess is therefore declared
# below, and each model states its own modalities.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # The DeepSeek adapter owns the `deepseek-official` route in the base
      # composition. This overlay routes the agent through pi-ai instead, so
      # the direct adapter is switched off rather than left shadowing it.
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true

      - insert:
          # Durable image bytes live outside the append-only session log;
          # messages keep content-addressed references that pi-ai resolves per
          # request. Without this row an image-carrying request fails with
          # UNSUPPORTED_CONTENT, so a vision composition must mount it.
          #
          # The limits admit one 8MP screenshot. They bound what enters the
          # store; `maxRequestImageBytes` below separately bounds what leaves
          # in a single request.
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
            config:
              maxImageBytes: 5242880
              maxImagesPerMessage: 6
              maxImagePixels: 8294400
              maxImageDimension: 4096

          - id: llm-pi-ai
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                tokenrouter:
                  displayName: TokenRouter
                  api: openai-completions
                  baseURL: !!js process.env.DSH_TOKENROUTER_BASE_URL ?? 'http://tokenrouter.omgwow.tech:8081/v1'
                  # Credential *reference*, resolved per request; no key here.
                  apiKeyEnv: DSH_TOKENROUTER_API_KEY

                  # pi-ai cannot recognize this URL, so it would otherwise send
                  # the OpenAI shape: the system prompt as `developer`, the
                  # output cap as `max_completion_tokens`. The gateway's
                  # upstreams are mostly non-OpenAI and reject both.
                  compat:
                    supportsDeveloperRole: false
                    maxTokensField: max_tokens

                  # Route fallback for a model whose entry says nothing. Text
                  # only: an undeclared model is assumed blind, so adding one
                  # cannot silently route images at a gateway that drops them.
                  defaultInput: [text]

                  # One request's total base64 image payload. Every image in
                  # history is re-encoded into every request, so past the bound
                  # the oldest are replaced by placeholder text and the session
                  # keeps completing requests instead of failing permanently.
                  # 12MiB sits under the gateway's body cap with headroom for
                  # the prompt, history, tools, and JSON.
                  maxRequestImageBytes: 12582912

                  # Verified against the live gateway on 2026-08-20 with a
                  # four-quadrant PNG whose colors cannot be guessed in order.
                  # `input: [text, image]` is a CLAIM about the endpoint, never
                  # a check of it, and this gateway makes the claim load-bearing:
                  # several of its models accept an image part, return HTTP 200,
                  # and answer about an image they never received. Declaring
                  # those `[text]` is what turns a confident wrong answer into
                  # an up-front refusal, so this list is the verified set and
                  # not the advertised one. Re-verify before adding a model;
                  # `deepseek-v3.2`, `deepseek-v4-flash`, `glm-5`, `glm-5.1`,
                  # `glm-5.2`, and `hy3` are the known silent droppers.
                  models:
                    - id: claude-opus-5
                      name: Claude Opus 5
                      contextWindow: 200000
                      maxTokens: 32768
                      input: [text, image]
                    - id: claude-sonnet-5
                      name: Claude Sonnet 5
                      contextWindow: 200000
                      maxTokens: 32768
                      input: [text, image]
                    - id: gemini-3.1-pro-preview
                      name: Gemini 3.1 Pro
                      contextWindow: 1048576
                      maxTokens: 32768
                      input: [text, image]
                    - id: gpt-5.6-sol
                      name: GPT-5.6 Sol
                      contextWindow: 400000
                      maxTokens: 32768
                      input: [text, image]
                    - id: qwen3.5-plus
                      name: Qwen3.5 Plus
                      contextWindow: 262144
                      maxTokens: 32768
                      input: [text, image]
                    - id: glm-5v-turbo
                      name: GLM-5V Turbo
                      contextWindow: 262144
                      maxTokens: 32768
                      input: [text, image]
                    # Text-only on purpose: this endpoint accepts an image part
                    # and silently discards it. `[text]` makes the harness
                    # refuse the image instead of letting the model answer
                    # about one it never saw.
                    - id: deepseek-v3.2
                      name: DeepSeek V3.2 (text only)
                      contextWindow: 128000
                      maxTokens: 32768
                      input: [text]

      # Point the agent at the gateway's vision route. A config patch replaces
      # the entry's config rather than merging into it, so the base entry's
      # required fields are restated here.
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: tokenrouter
              model: claude-opus-5
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Use read_image to look at an image the user names. Report only what
            you actually see in it; say so plainly if you received no image.
